# 乒乓球有效比赛检测 —— 全部可调参数
# 拿到真实录像后，主要动 audio.k_mad / fuse.enter / fuse.exit 这三个。

audio:
  sr: 16000              # 重采样目标采样率
  n_fft: 512             # 32ms 窗
  hop: 160               # 10ms 步进 -> 100 帧/秒
  fmin: 800              # 击球声能量下限 (Hz)
  fmax: 6000             # 上限。人声基频/球馆低频噪音被挡在 800Hz 以下
  k_mad: 4.0             # 自适应阈值 = 局部中位数 + k * MAD。调高=更严格，漏检增加
  noise_win_s: 2.0       # 局部噪声统计窗长（秒）
  min_gap_s: 0.06        # 两次击球最小间隔。近台快撕约 6 拍/秒 -> 0.06s 是下限

motion:
  enabled: true
  sample_fps: 5.0        # 运动分析抽帧率，够用且快
  width: 320             # 降采样宽度
  pixel_noise: 12        # 像素差绝对值低于此值视为噪点（0-255）
  roi: null              # 可选 [x, y, w, h]，归一化 0-1。标定球台后填入可大幅抗干扰

scene:
  enabled: true
  samples: 5             # 抽几帧估计场景是否像固定机位乒乓球
  width: 160             # 场景粗筛用的小图宽度
  gate: 0.12             # 中下区域水平边缘强度低于此值时，压低融合分数

fuse:
  dt: 0.1                # 融合时间轴分辨率（秒）
  hit_window_s: 1.5      # 击球密度统计半窗
  w_audio: 0.6           # 方案里是 音频40/运动40/姿态20；原型无姿态，按 6:4 分配
  w_motion: 0.4
  require_motion: true   # 音频不能单独判定有效片段，必须有本画面运动交叉验证
  motion_gate: 0.15      # 运动低于此值时压低融合分数，防止人声/音乐/场外击球误触发
  enter: 0.75            # 进入 PLAYING 的分数阈值。调高可压低有运动的非乒乓球误报
  exit: 0.25             # 跌破此值开始计时退出（滞回，防止抖动切碎）
  min_enter_s: 1.0       # 需连续超过 enter 多久才算真的开打
  end_silence_s: 5.0     # 多久没动静判定结束（方案指定 5 秒）
  min_segment_s: 3.0     # 过短片段丢弃
  merge_gap_s: 2.0       # 间隔小于此值的相邻片段合并
  pad_start_s: 1.0       # 片段前扩（补上发球引拍）
  pad_end_s: 1.5         # 片段后扩（补上得分后的反应）

render:
  # 成片最后一段的淡出时长（画面渐黑 + 声音渐弱）。
  # 结尾「仓促」的根源是硬切，不是尾巴短 —— 淡出给观众结束信号。
  # 时长要够长：0.8 秒时 -0.4s 就暗到一半、-0.2s 基本看不清，
  # 动作被压缩在很短的窗口里，观感上像「定格渐黑」。1.6 秒衰减更缓，
  # 主体运动全程可见。音频淡出比画面更重要。
  fade_out_s: 1.6
  # 慢动作：只放慢制胜那一拍前后的一小段，位置来自 last_hit 时间戳。
  # 必须放在 render 段内 —— render.cut() 只拿到 cfg["render"]。
  slowmo:
    enabled: false       # 默认关闭：慢动作用多了会腻
    factor: 0.6          # 放慢倍率。0.5 等于 15fps，乒乓球高速运动下卡顿明显
    lead_s: 0.35         # 击球前保留多久
    tail_s: 0.55         # 击球后保留多久
    smooth: false        # 插帧补流畅（minterpolate），质量好但慢
  crf: 20
  preset: veryfast
  audio_bitrate: 160k

ball:
  enabled: true
  width: 960             # 不降采样 —— 球只有 6-10 像素，缩一半就没了
  diff_thr: 12           # 三帧差分二值化阈值
  area_min: 3            # 连通域面积下限（球带运动模糊会拉长）
  area_max: 250          # 上限，超过就是手臂/球拍
  box_max: 45            # 外接框超过此值判定为球员等大目标
  min_px_per_frame: 2    # 位移下限，滤掉静止噪点
  max_px_per_frame: 90   # 上限。60km/h 时约 120px/帧，留余量但别太大否则乱连
  accel_tol: 0.45        # 匀速直线容差，相对位移的比例
  bright_min: 170        # 连通域平均灰度下限。白球在蓝紫场地上最亮，
                         # 这一条把候选从 77 个/帧压到 1.7 个/帧 —— 面积完全无区分力
  use_color: false       # HSV 颜色门：在视频 B 上量的阈值搬到视频 A 反而变差(AUC 0.681->0.616)，
                         # 不同灯光下球的饱和度不同，硬编码阈值不可移植。默认关闭。
  sat_max: 70            # 饱和度上限，挡掉皮肤(102)/红地面(146)/蓝台(92)
  val_min: 170           # 明度下限，挡掉白墙(145)等暗淡的低饱和区域

highlight:
  spot_seconds: 45          # 「精华」的目标时长：几十秒能看完，发群里刚好
  gap_s: 0.7             # 击球间隔超过此值即分段。真实回合是 0.5-2.8 秒的爆发，
                         # 中间隔 8-10 秒捡球；gap 一大就把捡球吞进来。
                         # 实测真打球占比：gap2.0=41%, 1.5=44%, 1.0=58%, 0.7=74%
  # 「算不算一个回合」的阈值，对着穷尽标注调过（重排开启后）：
  #   min_dur=1.0/min_hits=4 -> 8 与 5 个回合（真值 12 与 17）
  #   min_dur=0.3/min_hits=2 -> 11 与 14 个回合，忙碌占比也更接近真值
  min_duration_s: 0.3
  min_hits: 2
  # 「值不值得剪成一段」的阈值 —— 和上面是两回事：统计要准，出片要能看。
  # 0.3 秒的回合该计入统计，但剪出来没法看。
  clip_min_s: 1.5
  # 「有效打球时长」专用的间隔阈值，比 gap_s 小。两个目标冲突：
  # 实测 gap 0.3 时忙碌占比误差 5.1 个百分点但回合数误差 7.6 个；
  # gap 0.7 时回合数误差 2.4 个但忙碌占比误差 15.4 个百分点。
  # 所以时长用 0.3、回合分组用 0.7，各取所长。
  busy_gap_s: 0.3
  # 完整版：每个候选前后各留多少秒。实测 0.5 时保留 35%、召回 0.927，
  # 比 BetterPlay 的「保留 64%、召回 0.962」用一半时长覆盖差不多的球。
  trim_pad_s: 0.5
  trim_min_s: 0.6
  trim_bounce: true      # 在球落地弹跳处截断回合。不开的话回合会被弹跳声拖长，
                         # 把捡球画面剪进集锦
  bounce_min_count: 4    # 弹跳最少连续几次间隔递减
  bounce_final_ioi: 0.16 # 弹跳末尾的间隔上限 —— 越弹越快
  bounce_ratio_std: 0.10 # 相邻间隔比值的标准差上限。恢复系数是常数，
                         # 比值必然一致；回合内的递减比值是散的（实测 0.19）
  bounce_ratio_lo: 0.40  # 比值合理区间
  bounce_ratio_hi: 0.85
  top_n: 20              # 片段平均只有 3 秒，要凑够时长得多取几个
  pad_start_s: 0.4       # 前扩。扩边是稀释真打球占比的主因：
  pad_end_s: 0.7         # 同样的核心，扩 1.2/1.8 秒占比 46%，扩 0.4/0.7 秒 60%
  # 成片最后一段额外多留的尾巴。整片在最后一拍后立刻黑屏会显得很仓促，
  # 但为此把每一段都加长不划算 —— 实测全局 +1 秒会让真打球占比从 74% 掉到 60%，
  # 而只加最后一段的代价接近于零（10 段里只有 1 段变长）。
  # 可为负。基础 pad_end_s 是 0.7，这里 0.3 意味着最后一拍后总共留 1.0 秒。
  final_pad_end_s: 0.3
  weights:               # 方案模块六的评分权重（「结果」项判不了，已去掉）
    rally_length: 0.35   # 相持长度
    power: 0.25          # 击球力量（谱通量峰值）。速度快、力量大、声音响的
                         # 往往是最高潮的部分 —— 对应方案模块六的「击球速度」
    hit_rate: 0.15       # 击球频率
    motion: 0.15         # 近似「移动范围 + 动作幅度」
    duration: 0.10
  end_min_hits: 4        # 强/弱收尾分类的最少拍数。一两拍的回合比值噪声太大
  bounce_lookahead_s: 3.0  # 回合结束后多久内出现的弹跳算作本回合的收尾。
                           # gap 降到 0.7 后弹跳会成为独立的簇，必须往后看才找得到
  sparse_gap_s: 4.0        # 回合间空档中位数超过此值判为「稀疏型」（对练，大量捡球）。
                           # 实测 06a6c98c 为 6.1s，352e7b27/dc393956 为 1.2-1.5s
  dedupe_overlap_s: 0.5    # 跨主题去重：与已出片主题重叠超过此秒数即剔除。
                           # 实测「最帅击球」与「最长对拉」前10名重叠 3-6/10，
                           # 力量与回合长度天然相关，光换指标解决不了

rerank:
  enabled: true          # 候选重排。用 rerank-train 训练后自动生效
  keep_ratio: 0.6        # 保留概率最高的这个比例。实测跨视频：
                         # 保留 60% 时准确率 0.381->0.530 / 0.493->0.678，召回约 0.83
                         # 必须按比例而非固定概率阈值 —— 概率标定不跨视频
                         # （固定 0.5 时某方向召回只剩 0.170）
  model: models/rerank.pkl

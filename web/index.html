<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipo AI</title>
<style>
/* ── 设计系统 ─────────────────────────────────────────────
   间距 4/8/12/16/20/32，字号 11.5/12.5/13/15/17
   中性色偏暖；强调色只出现在「当前选中」和「主操作」两处，不滥用 */
:root{
  --bg:#f7f7f6; --surface:#fff; --surface-2:#fafaf9;
  --line:#e8e6e3; --line-2:#d6d3cf;
  --ink:#18181b; --ink-2:#52525b; --ink-3:#8b8782;
  --accent:#2563eb; --on-accent:#fff; --accent-wash:#eff4ff; --accent-line:#bfd3fe;
  --warn:#b45309; --warn-wash:#fffbeb;
  --r-sm:6px; --r:10px; --r-lg:14px;
  --shadow:0 1px 2px rgba(24,24,27,.04),0 4px 12px rgba(24,24,27,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1012; --surface:#17181b; --surface-2:#1c1e21;
    --line:#26282c; --line-2:#34373c;
    --ink:#f4f4f5; --ink-2:#a1a1aa; --ink-3:#71717a;
    --accent:#5b8dff; --on-accent:#0b1220; --accent-wash:#161d2e; --accent-line:#2b3d63;
    --warn:#f0b429; --warn-wash:#1f1a0e;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
       "Segoe UI","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,label{font-family:inherit}
::selection{background:var(--accent-wash)}

.top{height:60px;padding:0 24px;border-bottom:1px solid var(--line);
  background:var(--surface);display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:20}
.logo{width:26px;height:26px;border-radius:7px;background:var(--accent);
  display:grid;place-items:center;color:var(--on-accent);font-size:14px;font-weight:700}
.brand{font-size:15px;font-weight:640;letter-spacing:-.01em}
.tag{font-size:12.5px;color:var(--ink-3);padding-left:12px;
  border-left:1px solid var(--line)}
.who{margin-left:auto;font-size:12.5px;color:var(--ink-3)}
.lang{border:1px solid var(--line-2);background:transparent;
  color:var(--ink-3);border-radius:999px;padding:4px 12px;font-size:12px;
  cursor:pointer;transition:all .12s ease;font-variant:tabular-nums}
.lang:hover{border-color:var(--accent);color:var(--accent)}

.shell{display:grid;grid-template-columns:280px minmax(0,1fr);height:calc(100% - 60px)}
.side{border-right:1px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;min-height:0}
.side-hd{padding:16px 16px 12px;display:flex;align-items:center;
  justify-content:space-between;gap:8px}
.side-body{overflow-y:auto;padding:0 12px 16px;flex:1;min-height:0}
.stage-wrap{overflow-y:auto;min-height:0}
.stage{max-width:760px;margin:0 auto;padding:32px 32px 64px}
.eyebrow{font-size:11px;font-weight:660;letter-spacing:.06em;color:var(--ink-3)}

.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  border:1px solid transparent;background:transparent;color:inherit;font:inherit;
  padding:8px 10px;border-radius:var(--r);cursor:pointer;margin-bottom:2px;
  transition:background .12s ease,border-color .12s ease}
.item:hover{background:var(--surface-2)}
.item[aria-selected="true"]{background:var(--accent-wash);border-color:var(--accent-line)}
/* 缩略图固定 4:3 框：素材有横有竖，不固定框列表左缘会参差不齐 */
.item .th{width:52px;height:39px;flex:0 0 auto;object-fit:cover;border-radius:6px;
  background:var(--line);display:block}
.item .meta{min-width:0;flex:1}
.item .t{display:-webkit-box;font-size:13px;line-height:1.4;word-break:break-all;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .s{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px;
  font-variant-numeric:tabular-nums}

.up{border:1px solid var(--line-2);border-radius:999px;padding:5px 12px;
  font-size:12px;cursor:pointer;color:var(--ink-2);background:var(--surface);
  white-space:nowrap;transition:all .12s ease}
.up:hover{border-color:var(--accent);color:var(--accent)}
.up[data-busy="1"]{opacity:.55;pointer-events:none}
.side-acts{display:flex;gap:6px;align-items:center}
/* 导入是主操作 —— 列表空的时候它是唯一能干的事，得一眼看到。
   多选是次操作，保持描边。 */
.up.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);
  font-weight:560}
.up.primary:hover{filter:brightness(1.08);color:var(--on-accent)}
/* 多选激活用淡色底而不是实心：两个实心按钮并排会互相抢，
   但又必须看得出是「按下」状态 —— 否则用户不知道当前点击会叠加还是替换。 */
.up[aria-pressed="true"]{background:var(--accent-wash);border-color:var(--accent);
  color:var(--accent);font-weight:560}
.item .ck{width:16px;height:16px;border:1.5px solid var(--line-2);
  border-radius:4px;display:grid;place-items:center;
  font-size:10px;line-height:1;color:transparent;flex:0 0 auto}
.item[aria-selected="true"] .ck{border-color:var(--accent);background:var(--accent);
  color:var(--on-accent)}
.prog{height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin:0 16px 10px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .12s}
.side.drop{outline:2px dashed var(--accent);outline-offset:-10px;background:var(--accent-wash)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
.card-pad{padding:20px}
.card-hd{padding:15px 20px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-hd h3{margin:0;font-size:14px;font-weight:620;letter-spacing:-.005em}

.player{background:#000;display:grid;place-items:center;min-height:180px}
video{max-width:100%;display:block}

.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));
  border-top:1px solid var(--line)}
.metric{padding:14px 20px;border-right:1px solid var(--line)}
.metric:last-child{border-right:0}
.metric b{display:block;font-size:17px;font-weight:640;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.35}
.metric span{font-size:11.5px;color:var(--ink-3)}

/* 主题名排成一行，说明统一显示在下方 —— 说明写进按钮会让宽度参差、换行成好几排 */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
/* 主题条藏了滚动条，右侧不给提示就会被当成「渲染坏了」——
   溢出时右缘渐隐，滚到底自动去掉。 */
.chips.more{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent);
  mask-image:linear-gradient(90deg,#000 calc(100% - 36px),transparent)}
.chip{flex:0 0 auto;white-space:nowrap;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink-2);border-radius:999px;
  padding:7px 15px;font-size:13px;font-weight:500;cursor:pointer;
  transition:all .14s cubic-bezier(.2,.7,.3,1)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
  color:var(--on-accent);font-weight:560}
.desc{color:var(--ink-2);font-size:13px;margin-top:14px;min-height:1.6em}

/* 素材顺序：横向缩略图条，拖动改顺序。
   给了画面才谈得上「排序」—— 只有文件名的话用户是在猜。 */
.ord{display:flex;gap:10px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
.ord-i{flex:0 0 auto;width:108px;cursor:grab;position:relative;
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  background:var(--surface-2);transition:border-color .12s ease,opacity .12s ease}
.ord-i:active{cursor:grabbing}
.ord-i.drag{opacity:.35}
.ord-i.over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-wash)}
.ord-i img{width:100%;height:76px;object-fit:cover;display:block;background:var(--line)}
.ord-i .n{position:absolute;top:5px;left:5px;min-width:18px;height:18px;padding:0 5px;
  border-radius:9px;background:var(--accent);color:var(--on-accent);
  font-size:11px;font-weight:640;display:grid;place-items:center;
  font-variant-numeric:tabular-nums}
.ord-i .nm{display:block;padding:5px 7px 6px;font-size:11px;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.btn{border:0;border-radius:var(--r);padding:10px 22px;font-size:14px;font-weight:560;
  cursor:pointer;background:var(--accent);color:var(--on-accent);
  transition:filter .12s ease,transform .06s ease}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line-2);
  padding:6px 14px;font-size:13px;text-decoration:none;display:inline-block}
.btn.ghost:hover{border-color:var(--accent);filter:none}

.note{font-size:12.5px;color:var(--ink-3);line-height:1.55}
.alert{display:flex;gap:8px;align-items:flex-start;background:var(--warn-wash);
  color:var(--warn);font-size:12.5px;padding:10px 14px;border-radius:var(--r-sm);
  line-height:1.5}
/* 只影响观感的提示用中性色 —— 和「没音轨、根本剪不了」用同一个黄色警告，
   等于告诉用户每段素材都有问题，久了就没人看了 */
.alert.info{background:var(--surface-2);color:var(--ink-2)}
.run{display:flex;align-items:center;gap:11px;font-size:13.5px;color:var(--ink-2)}
.spin{width:15px;height:15px;border:2px solid var(--line-2);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.blank{text-align:center;padding:96px 24px;color:var(--ink-3)}
.blank .ic{font-size:28px;line-height:1;margin-bottom:14px;opacity:.45}
.blank p{margin:0;font-size:14px}
.blank .sub{font-size:12.5px;margin-top:6px;opacity:.8}
.sk{background:linear-gradient(90deg,var(--line) 25%,var(--surface-2) 50%,var(--line) 75%);
  background-size:200% 100%;animation:sh 1.3s ease-in-out infinite;border-radius:var(--r-sm)}
@keyframes sh{to{background-position:-200% 0}}

/* 完整版默认折叠：它是存档用的，不是每次都要看的东西 */
.card.fold .foldbody{display:none}
.card.fold[data-open="1"] .foldbody{display:block}
.card.fold .card-hd{border-bottom:0}
.card.fold[data-open="1"] .card-hd{border-bottom:1px solid var(--line)}
.caret{color:var(--ink-3);font-size:12px;width:14px;text-align:center}
.segs{display:flex;flex-wrap:wrap;gap:6px;padding:14px 20px;
  border-top:1px solid var(--line);background:var(--surface-2)}
.seg{display:inline-flex;align-items:stretch;border:1px solid var(--line);
  background:var(--surface);border-radius:6px;overflow:hidden;
  font-variant-numeric:tabular-nums;transition:border-color .12s ease}
.seg:hover{border-color:var(--accent-line)}
.seg[data-on="1"]{border-color:var(--accent);background:var(--accent-wash)}
.seg button{border:0;background:transparent;color:var(--ink-2);cursor:pointer;
  font-size:11.5px;padding:4px 8px;font-family:inherit}
.seg button:hover{color:var(--accent)}
.seg a{display:grid;place-items:center;padding:0 7px;color:var(--ink-3);
  text-decoration:none;font-size:12px;border-left:1px solid var(--line)}
.seg a:hover{color:var(--accent);background:var(--accent-wash)}
/* ✕ 是低频操作，默认收起 —— 常态只留「跳转」和「下载」两个高频动作 */
.seg a.rej{display:none}
.segs[data-edit="1"] .seg a.rej{display:grid}
.seg a.rej:hover{color:var(--warn);background:var(--warn-wash)}
.mark{background:transparent;border:1px solid var(--line-2);color:var(--ink-3);
  border-radius:999px;padding:4px 11px;font-size:12px;cursor:pointer;
  transition:all .12s ease;white-space:nowrap}
.mark:hover{border-color:var(--warn);color:var(--warn)}
.mark[aria-pressed="true"]{border-color:var(--warn);color:var(--warn);
  background:var(--warn-wash)}
.seg[data-rejected="1"]{opacity:.45;border-color:var(--warn)}
.seg[data-rejected="1"] button{text-decoration:line-through}
.fb{margin-top:12px;font-size:12.5px;color:var(--ink-3);display:flex;
  align-items:center;gap:8px;flex-wrap:wrap}
.fb b{color:var(--ink-2);font-weight:600}
.segs-hd{font-size:11.5px;color:var(--ink-3);width:100%;margin-bottom:2px}

@media (max-width:880px){
  .shell{grid-template-columns:1fr;height:auto}
  .side{border-right:0;border-bottom:1px solid var(--line)}
  .side-body{max-height:180px}
  .stage{padding:20px 16px 48px}
}
</style>

<div class="top">
  <div class="logo">P</div>
  <div class="brand">Pipo AI</div>
  <div class="tag" id="tagline">Your table tennis highlights, automatically</div>
  <span class="who" id="who"></span>
  <button class="lang" id="lang" title="中文 / English">EN</button>
  <button class="lang" id="signout" title="退出 / Sign out">⏻</button>
</div>

<div class="shell">
  <div class="side" id="side">
    <div class="side-hd">
      <span class="eyebrow" id="lbl-videos">录像</span>
      <div class="side-acts">
        <button class="up" id="multi" type="button"><span id="multitxt">选择文件</span></button>
        <label class="up primary" id="up">
          <input type="file" id="file" multiple
                 accept="video/mp4,video/quicktime,.mp4,.mov,.m4v" hidden>
          <span id="uptxt">导入素材</span>
        </label>
      </div>
    </div>
    <div id="prog"></div>
    <div class="side-body" id="list" role="listbox" aria-multiselectable="true"
         aria-label="录像列表"></div>
    <div class="note" id="multihint" style="padding:8px 12px 12px"></div>
  </div>
  <div class="stage-wrap"><div class="stage" id="stage"></div></div>
</div>

<script>
const I18N = {
  zh:{ tagline:'训练录像，自动出片', videos:'录像', pick:'导入素材', uploading:'上传中',
       upfail:'上传失败', nobackend:'后端没连上',
       novideo:'还没有录像。点右上角「导入素材」，或把视频拖进来。',
       blank:'选一段录像开始', blankSub:'也可以把视频文件拖到左侧',
       multiHint:'点「多选素材」可挑多段一起剪', multiSel:'已选 %d 段素材 · 合计 %s',
       selMode:'多选素材', selDone:'完成 (%d)', multiOn:'点条目加选／取消，选好后点「完成」',
       spotFrom:(n,d)=>`${n} 个回合，从 ${d} 的素材里挑出来的`,
       trimCut:d=>`剪掉了 ${d} 的捡球和等待`,
       order:'素材顺序', orderAuto:'按拍摄时间排列 · 可拖动调整',
       orderManual:'已手动调整 · 可继续拖动',
       duration:'时长', resolution:'分辨率', quality:'质量评分',
       theme:'剪辑主题', go:'开始剪辑', submitting:'提交中', failed:'剪辑失败',
       auto:'自动', autoDesc:'去掉捡球和等待，一个球都不漏（约压到六成）',
       analysis:'录像分析', structure:'结构', rallies:'回合',
       playtime:'有效打球', ratio:'占比', sparse:'捡球多', dense:'连续打',
       accuracy:'回合数与时长有 10–20% 误差；击球总数偏高，暂不展示。',
       download:'下载', del:'删除片段', done:'完成',
       segsHint:n=>`${n} 个片段 · 点时间跳转，↓ 单独下载`,
       delHint:'点 ✕ 删除这一段 —— 成片会立刻重拼，同时作为负例回流训练',
       empty:'这段录像里没有符合条件的片段。',
       fbNone:'看到不对的片段就删掉 —— 这些反馈会直接变成训练数据，用得越多越准。',
       fbSome:(n,s,v)=>`已收到 <b>${n}</b> 处反馈，共 <b>${s}</b> 秒，来自 ${v} 个视频。这些会作为负例并入下次训练。`,
       segTitle:'下载这一段', delTitle:'删除这一段' },
  en:{ tagline:'Your table tennis highlights, automatically', videos:'Videos',
       pick:'Import', uploading:'Uploading', upfail:'Upload failed',
       nobackend:'Backend not reachable',
       novideo:'No videos yet. Click "Import", or drop one here.',
       blank:'Pick a video to start', blankSub:'or drop a file on the left',
       multiHint:'Use “Multi-select” to combine several clips', multiSel:'%d clips selected · %s total',
       selMode:'Multi-select', selDone:'Done (%d)', multiOn:'Tap items to add or remove, then “Done”',
       spotFrom:(n,d)=>`${n} rallies, picked from ${d} of footage`,
       trimCut:d=>`${d} of idle time removed`,
       order:'Clip order', orderAuto:'By capture time · drag to reorder',
       orderManual:'Manually ordered · drag to adjust',
       duration:'Length', resolution:'Resolution', quality:'Quality',
       theme:'Edit style', go:'Create', submitting:'Submitting', failed:'Failed',
       auto:'Auto', autoDesc:'Cuts out ball retrieval and waiting — every rally kept (about 60% of the original)',
       analysis:'Analysis', structure:'Structure', rallies:'Rallies',
       playtime:'Play time', ratio:'Share', sparse:'Lots of waiting', dense:'Mostly playing',
       accuracy:'Rally count and play time carry 10–20% error; total strokes runs high and is not shown.',
       download:'Download', del:'Remove clips', done:'Done',
       segsHint:n=>`${n} clips · click a time to jump, ↓ to download`,
       delHint:'Click ✕ to remove a clip — the reel is rebuilt at once and the clip trains the model',
       empty:'No clips matched in this video.',
       fbNone:'Remove clips that look wrong — that feedback becomes training data.',
       fbSome:(n,s,v)=>`<b>${n}</b> corrections so far, <b>${s}</b> seconds across ${v} videos. They join the next training run.`,
       segTitle:'Download this clip', delTitle:'Remove this clip' }
};
let LANG = localStorage.getItem('pipo_lang')
  || (navigator.language||'').toLowerCase().startsWith('zh') ? 'zh' : 'en';
LANG = localStorage.getItem('pipo_lang') || LANG;
const t = (k,...a) => { const v = I18N[LANG][k]; return typeof v==='function'?v(...a):v; };
const themeName = x => LANG==='en' ? (x.name_en||x.name) : x.name;
const themeDesc = x => LANG==='en' ? (x.desc_en||x.desc) : x.desc;

// 任何接口返回 401 都说明 cookie 没了或失效，统一跳登录页 ——
// 否则页面会静默变空，用户不知道发生了什么
const _fetch = window.fetch;
window.fetch = async (...a) => {
  const r = await _fetch(...a);
  if(r.status === 401) location.href = '/login.html';
  return r;
};

const $ = s => document.querySelector(s);
const el = (t,c,h) => { const e=document.createElement(t);
  if(c) e.className=c; if(h!=null) e.innerHTML=h; return e; };
// 先对总秒数取整再拆分。写成 Math.round(s%60) 会让 119.7s 显示成 1:60
const mmss = s => { const t = Math.round(s);
  return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`; };
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let videos=[], themes=[], cur=null, sel=[], pickTheme='auto', poll=null;
let multiMode=false;

async function boot(){
  $('#list').innerHTML = '<div class="sk" style="height:50px;margin:2px 0"></div>'.repeat(4);
  blank('▤',t('blank'),t('blankSub'));
  try{
    [videos, themes] = await Promise.all([
      fetch('/api/videos').then(r=>r.json()),
      fetch('/api/themes').then(r=>r.json())]);
  }catch(e){
    $('#list').innerHTML=`<div class="note" style="padding:0 12px">${t('nobackend')}</div>`; return;
  }
  drawList();
}

function drawList(){
  const L=$('#list'); L.innerHTML='';
  if(!videos.length){
    L.appendChild(el('div','note',t('novideo'))); return;
  }
  videos.forEach((v,i)=>{
    const b = el('button','item',
      `<img class="th" src="/api/thumb?id=${encodeURIComponent(v.id)}"
            alt="" loading="lazy" onerror="this.style.visibility='hidden'">
       <span class="meta">
         <span class="t">${esc(shotLabel(v))}</span>
         <span class="s">${mmss(v.duration)} · ${v.width}×${v.height}</span>
       </span>
       ${multiMode?'<span class="ck">✓</span>':''}`);
    b.setAttribute('role','option');
    b.title = v.name;          // 文件名退到 tooltip，需要时还能查
    b.setAttribute('aria-selected', sel.includes(v.id) ? 'true':'false');
    // 多选模式下点击即切换；平时点击=只选这个，保持单选手感 ——
    // 反过来做会让「换一个视频」变成先取消再选的两步。
    // ⌘/Ctrl/Shift 作为熟手快捷方式一直有效。
    b.onclick = e => choose(i, multiMode||e.metaKey||e.ctrlKey||e.shiftKey);
    L.appendChild(b);
  });
}

// 素材顺序条：拖动改接续顺序。用 HTML5 drag 而不是自己算指针位移 ——
// 后者要处理滚动、触摸、边界，代码量翻几倍而收益只是动画更顺。
function drawOrder(){
  const box = $('#ord');
  if(!box) return;
  box.innerHTML = '';
  picked().forEach((v, i) => {
    const d = el('div','ord-i',
      `<span class="n">${i+1}</span>
       <img src="/api/thumb?id=${encodeURIComponent(v.id)}" alt=""
            onerror="this.style.visibility='hidden'">
       <span class="nm">${esc(shotLabel(v))}</span>`);
    d.draggable = true;
    d.title = v.name;
    d.dataset.id = v.id;
    d.ondragstart = e => { e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain', v.id); d.classList.add('drag'); };
    d.ondragend   = () => d.classList.remove('drag');
    d.ondragover  = e => { e.preventDefault(); d.classList.add('over'); };
    d.ondragleave = () => d.classList.remove('over');
    d.ondrop = e => {
      e.preventDefault(); d.classList.remove('over');
      const from = sel.indexOf(e.dataTransfer.getData('text/plain'));
      const to   = sel.indexOf(v.id);
      if(from < 0 || to < 0 || from === to) return;
      sel.splice(to, 0, sel.splice(from, 1)[0]);
      reordered = true;      // 用户表过态了，之后加选不再自动重排
      draw();
    };
    box.appendChild(d);
  });
}

function blank(ic,msg,sub){
  $('#stage').innerHTML = `<div class="blank"><div class="ic">${ic}</div><p>${msg}</p>
    ${sub?`<div class="sub">${sub}</div>`:''}</div>`;
}

function choose(i, add){
  const v = videos[i];
  if(add){
    if(sel.includes(v.id)){
      if(sel.length>1) sel = sel.filter(x=>x!==v.id);   // 不允许清空到零
    } else {
      sel.push(v.id); sortSel();      // 新加的按拍摄时间落到该在的位置
    }
  } else {
    sel = [v.id];
  }
  // cur 是「面板上显示哪一段」：加选时保持不动，单选时跟着走。
  if(!cur || !sel.includes(cur.id)) cur = picked()[0];
  [...$('#list').children].forEach((e,j)=>
    e.setAttribute('aria-selected', sel.includes(videos[j].id)?'true':'false'));
  syncMulti();
  draw();
}

// sel 是**有序**的 id 数组：成片的接续顺序就是它，所以不能用 Set。
// 存 id 不存对象 —— 上传后 videos 会整个重建，存引用会让选中态凭空丢失。
function picked(){ return sel.map(id=>videos.find(v=>v.id===id)).filter(Boolean); }

// 素材的主标签用拍摄时间，不用文件名。
// 文件名基本都是 dc393956ce8c… 这类哈希，用户分不出哪段是哪段；
// 而「7月27日 15:53」立刻能对上是哪次训练。
function shotLabel(v){
  if(!v.shot_at) return v.name;
  const d = new Date(v.shot_at*1000);
  const hm = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return LANG==='en'
    ? d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+', '+hm
    : (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
}
// 「素材没问题」不该显示成警告条。老记录里存的是旧文案，一并认掉。
const NOTE_OK = ['视频质量良好','素材没问题，可以直接剪','Looks good','Good to go',''];
function noteOf(v){
  const n = LANG==='en' ? (v.note_en||v.note) : v.note;
  if(!n || NOTE_OK.includes(n) || NOTE_OK.includes(v.note)) return null;
  // 没音轨是唯一真正挡路的问题 —— 其它都只影响观感，不该用同一个红色警告
  return {text:n, blocking:/没有音轨|无音轨|No audio track/.test(n)};
}
// 默认按拍摄时间；用户拖动调整后不再自动重排（reordered 置位）。
let reordered=false;
function sortSel(){
  if(reordered) return;
  const at=id=>(videos.find(v=>v.id===id)||{}).shot_at||0;
  sel.sort((a,b)=>at(a)-at(b));
}

// 「多选素材」开关：在已导入的素材里挑几段一起剪。
// 做成显式模式而不是只靠 ⌘ —— 修饰键是隐藏交互，没人会去猜。
function syncMulti(){
  const b=$('#multi');
  b.setAttribute('aria-pressed', multiMode?'true':'false');
  $('#multitxt').textContent = multiMode
    ? t('selDone').replace('%d', picked().length) : t('selMode');
  b.style.display = videos.length > 1 ? '' : 'none';
  $('#multihint').textContent =
    videos.length < 2 ? '' : (multiMode ? t('multiOn') : t('multiHint'));
}
$('#multi').onclick = ()=>{
  multiMode = !multiMode;
  drawList(); syncMulti();
};

/* 原生菜单里只留「播放速度」：下载在卡片上已有独立入口，重复了。
   #t=0.5 让浏览器解码并显示首帧 —— 否则 preload=metadata 下播放器是一片纯黑，
   看起来像加载失败。 */
function player(src, portrait){
  const poster = src + (src.includes('#') ? '' : '#t=0.5');
  return `<div class="player"><video src="${poster}" controls
    controlslist="nodownload noremoteplayback" disablepictureinpicture
    preload="metadata" style="max-height:${portrait?420:360}px"></video></div>`;
}

function draw(){
  const v=cur, portrait=v.height>v.width;
  $('#stage').innerHTML = `
    <div class="card">
      ${player('/source?id='+v.id, portrait)}
      <div class="metrics">
        <div class="metric"><b>${mmss(v.duration)}</b><span>${t('duration')}</span></div>
        <div class="metric"><b>${v.width}×${v.height}</b><span>${t('resolution')}</span></div>
        <div class="metric"><b>${v.quality}</b><span>${t('quality')}</span></div>
      </div>
      ${(n => n ? `<div class="card-pad" style="padding-top:16px">
             <div class="alert${n.blocking?'':' info'}">
               <span>${n.blocking?'⚠':'ⓘ'}</span><span>${esc(n.text)}</span>
             </div></div>` : '')(noteOf(v))}
    </div>
    ${picked().length>1 ? `
    <div class="card">
      <div class="card-hd"><h3>${t('order')}</h3>
        <span class="who">${reordered?t('orderManual'):t('orderAuto')}</span></div>
      <div class="card-pad"><div class="ord" id="ord"></div></div>
    </div>` : ''}
    <div class="card">
      <div class="card-hd"><h3>${t('theme')}</h3>${picked().length>1
        ? `<span class="who">${t('multiSel')
             .replace('%d', picked().length)
             .replace('%s', mmss(picked().reduce((a,x)=>a+x.duration,0)))}</span>`
        : ''}</div>
      <div class="card-pad">
        <div class="chips" id="chips" role="group" aria-label="剪辑主题"></div>
        <div class="desc" id="desc"></div>
        <div style="margin-top:20px"><button class="btn" id="go">${t('go')}</button></div>
      </div>
    </div>
    <div id="out"></div>`;

  const all=[{id:'auto',name:t('auto'),name_en:t('auto'),
    desc:t('autoDesc'),desc_en:t('autoDesc')}, ...themes];
  const C=$('#chips');
  all.forEach(x=>{
    const b=el('button','chip'); b.textContent=themeName(x);
    b.setAttribute('aria-pressed', pickTheme===x.id?'true':'false');
    b.onclick=()=>{ pickTheme=x.id; draw(); };      // 单选
    C.appendChild(b);
  });
  // 用 ResizeObserver 而不是 window resize 监听：draw() 每次重建 #chips，
  // 挂在 window 上的监听不会被回收，点几次主题就攒一堆。
  const fade=()=>C.classList.toggle('more',
    C.scrollWidth - C.scrollLeft - C.clientWidth > 4);
  C.onscroll=fade; new ResizeObserver(fade).observe(C); fade();
  drawOrder();
  $('#desc').textContent = themeDesc(all.find(x=>x.id===pickTheme)||{}) || '';
  $('#go').onclick = start;
}

async function start(){
  $('#go').disabled = true;
  $('#out').innerHTML = `<div class="card"><div class="card-pad"><div class="run">
      <span class="spin"></span><span id="st">${t('submitting')}</span></div></div></div>`;
  let r;
  try{
    r = await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({videos:picked().map(v=>v.id), ordered:true,
                           themes:[pickTheme], top:10})}).then(x=>x.json());
  }catch(e){ return fail(t('failed')); }
  clearInterval(poll);
  poll = setInterval(async ()=>{
    let j; try{ j = await fetch('/api/jobs/'+r.id).then(x=>x.json()); }catch(e){ return; }
    const st=$('#st'); if(st) st.textContent = j.stage;
    if(j.state==='done'){ clearInterval(poll); done(j); }
    if(j.state==='error'){ clearInterval(poll); fail(j.error); }
  }, 600);
}

function fail(msg){
  $('#go').disabled=false;
  $('#out').innerHTML = `<div class="card"><div class="card-pad">
    <div class="alert"><span>⚠</span><span>${t('failed')}: ${esc(msg)}</span></div></div></div>`;
}

function done(j){
  $('#go').disabled=false;
  const s=j.stats||{}, k=j.kind||{}, portrait=cur.height>cur.width;
  let h = `<div class="card">
    <div class="card-hd"><h3>${t('analysis')}</h3></div>
    <div class="metrics" style="border-top:0">
      <div class="metric"><b>${k.kind==='sparse'?t('sparse'):t('dense')}</b><span>${t('structure')}</span></div>
      <div class="metric"><b>${s.rally_count ?? '—'}</b><span>${t('rallies')}</span></div>
      <div class="metric"><b>${s.playing_seconds!=null?mmss(s.playing_seconds):'—'}</b><span>${t('playtime')}</span></div>
      <div class="metric"><b>${s.playing_ratio!=null?Math.round(s.playing_ratio*100)+'%':'—'}</b><span>${t('ratio')}</span></div>
    </div>
    <div class="card-pad" style="padding-top:14px">
      <div class="note">${t('accuracy')}</div>
    </div></div>`;

  // 「自动」会出两条：精华（当场看）和完整版（存档）。
  // 平级并排会逼用户做一次没必要的选择，而且两个播放器堆在一起很重 ——
  // 精华当主角放前面，完整版折叠成一行。
  const all = j.results||[];
  const pair = all.some(r=>r.theme==='spot') && all.some(r=>r.theme==='trim');
  const ordered = pair
    ? [...all.filter(r=>r.theme==='spot'), ...all.filter(r=>r.theme!=='spot')]
    : all;
  const trimSec = (all.find(r=>r.theme==='trim')||{}).seconds;

  ordered.forEach((r)=>{
    const idx = all.indexOf(r);
    if(r.empty){
      h += `<div class="card"><div class="card-pad"><div class="note">
        ${t('empty')}</div></div></div>`;
      return;
    }
    const fold = pair && r.theme==='trim';
    // 写出两者的关系 —— 少了这句，用户会以为要在两个成片里二选一
    const rel = pair && r.theme==='spot' && s.duration
      ? `<div class="card-pad" style="padding:12px 20px 0"><div class="note">
           ${t('spotFrom', r.clips, mmss(s.duration))}</div></div>` : '';
    const sub = fold && s.duration!=null && trimSec!=null
      ? ` · ${t('trimCut', mmss(Math.max(0, s.duration - trimSec)))}` : '';
    h += `<div class="card${fold?' fold':''}"${fold?' data-open="0"':''}>
      <div class="card-hd"${fold?' data-fold="1"':''}>
        <h3>${esc(LANG==='en'?(r.name_en||r.name):r.name)} · ${
          fold ? mmss(r.seconds)+sub : r.clips+' / '+r.seconds+'s'}</h3>
        <span style="display:flex;gap:8px;align-items:center">
          ${fold?`<span class="caret">▸</span>`:
            `<button class="mark" data-mark="${idx}" aria-pressed="false">${t('del')}</button>`}
          <a class="btn ghost" href="${r.url}" download>${t('download')}</a>
        </span>
      </div>
      ${rel}
      <div class="foldbody">
      ${player(r.url, portrait)}
      <div class="segs" data-idx="${idx}" data-theme="${esc(r.theme)}">
        <div class="segs-hd">${t('segsHint',r.clips)}</div>
        ${r.segments.map((x,i)=>
        `<span class="seg" data-i="${i}" data-sid="${x.id}">
           <button data-off="${x.offset}" data-idx="${idx}">${mmss(x.start)}–${mmss(x.end)}</button>
           <a href="${x.url}" download title="${t('segTitle')}">↓</a>
           <a class="rej" href="#" data-s="${x.start}" data-e="${x.end}"
              title="${t('delTitle')}">✕</a>
         </span>`).join('')}
      </div>
      </div>
    </div>`;
  });
  h += `<div class="card"><div class="card-pad">
      <div class="fb" id="fb"></div></div></div>`;
  $('#out').innerHTML = h;
  $('#out').querySelectorAll('[data-fold]').forEach(hd=>{
    hd.style.cursor='pointer';
    hd.onclick = e => {
      if(e.target.closest('a')) return;      // 下载键不该顺带展开
      const c = hd.closest('.card');
      const open = c.dataset.open === '1';
      c.dataset.open = open ? '0' : '1';
      hd.querySelector('.caret').textContent = open ? '▸' : '▾';
    };
  });
  loadFeedback();

  // 「这段不对」：只声明这个区间没有有效击球，不要求用户精确到某一拍。
  // 这正是重排器要的监督信号 —— 区间内所有候选都是可信负例。
  // 「标记问题」进入编辑态才显示 ✕
  $('#out').addEventListener('click', e => {
    const m = e.target.closest('.mark');
    if(!m) return;
    const segs = $('#out').querySelector(`.segs[data-idx="${m.dataset.mark}"]`);
    const on = segs.dataset.edit === '1';
    segs.dataset.edit = on ? '' : '1';
    m.setAttribute('aria-pressed', on ? 'false' : 'true');
    m.textContent = on ? t('del') : t('done');
    segs.querySelector('.segs-hd').textContent = on
      ? t('segsHint', segs.querySelectorAll('.seg').length)
      : t('delHint');
  });

  $('#out').addEventListener('click', async e => {
    const a = e.target.closest('a.rej');
    if(!a) return;
    e.preventDefault();
    const seg = a.closest('.seg');
    const segs = seg.closest('.segs');
    if(seg.dataset.rejected === '1') return;
    const alive = [...segs.querySelectorAll('.seg')]
      .filter(x => x.dataset.rejected !== '1');
    if(alive.length <= 1) return;                 // 至少留一段
    seg.dataset.rejected = '1';
    const card = segs.closest('.card');
    const hd = card.querySelector('.card-hd h3');
    hd.dataset.busy = '1';
    try{
      // 删除 = 立刻从成片拿掉 + 记成负例，一个动作两件事
      await fetch('/api/feedback',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({video:cur.id, start:+a.dataset.s, end:+a.dataset.e})});
      const keep = [...segs.querySelectorAll('.seg')]
        .filter(x => x.dataset.rejected !== '1').map(x => +x.dataset.sid);
      const r = await fetch('/api/recut',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({video:cur.id, theme:segs.dataset.theme, keep})
      }).then(x=>x.json());
      if(r.url){
        const v = card.querySelector('video');
        v.src = r.url; v.load();
        hd.textContent = hd.textContent.replace(/· .*$/, `· ${r.clips} 段 / ${r.seconds} 秒`);
        seg.remove();
      }
      loadFeedback();
    }catch(err){ seg.dataset.rejected=''; }
    finally{ hd.dataset.busy=''; }
  });

  // 点片段 -> 主播放器跳到该片段在拼接成片里的位置
  $('#out').querySelectorAll('.seg button').forEach(b=>{
    b.onclick = ()=>{
      const wrap = b.closest('.segs');
      const v = wrap.previousElementSibling.querySelector('video');
      v.currentTime = parseFloat(b.dataset.off) + 0.05;
      v.play();
      wrap.querySelectorAll('.seg').forEach(s=>s.dataset.on='');
      b.parentElement.dataset.on = '1';
    };
  });
  // 播放过程中高亮当前片段
  $('#out').querySelectorAll('.card video').forEach(v=>{
    const wrap = v.closest('.card').querySelector('.segs');
    if(!wrap) return;
    const offs = [...wrap.querySelectorAll('.seg button')].map(b=>parseFloat(b.dataset.off));
    v.ontimeupdate = ()=>{
      let k = 0;
      for(let i=0;i<offs.length;i++) if(v.currentTime >= offs[i]) k = i;
      wrap.querySelectorAll('.seg').forEach((s,i)=>s.dataset.on = i===k ? '1' : '');
    };
  });
}

async function loadFeedback(){
  const el = $('#fb'); if(!el) return;
  try{
    const d = await fetch('/api/feedback').then(r=>r.json());
    el.innerHTML = d.total_ranges
      ? t('fbSome', d.total_ranges, d.total_seconds, d.videos.length)
      : t('fbNone');
  }catch(e){ el.textContent=''; }
}

function upload(f, done){
  const fin = ()=>{ if(done) done(); };
  if(!f) return fin();
  const lab=$('#up'), txt=$('#uptxt');
  lab.dataset.busy='1'; txt.textContent=t('uploading');
  $('#prog').innerHTML='<div class="prog"><i id="pb"></i></div>';
  const xhr=new XMLHttpRequest(); xhr.open('POST','/api/upload');
  xhr.upload.onprogress = e => { if(e.lengthComputable)
    $('#pb').style.width = (100*e.loaded/e.total)+'%'; };
  const reset=()=>{ lab.dataset.busy=''; txt.textContent=t('pick'); $('#prog').innerHTML=''; };
  const err=m=>{ reset();
    $('#prog').innerHTML=`<div class="note" style="padding:0 16px 10px;color:var(--warn)">${esc(m)}</div>`;
    fin(); };
  xhr.onload = ()=>{
    if(xhr.status===200){
      reset();
      const v = JSON.parse(xhr.responseText);
      const at = videos.findIndex(x => x.fp && x.fp === v.fp);
      if(at >= 0){ choose(at, multiMode); drawList();   // 已有同一个视频，直接选中它
        $('#prog').innerHTML =
          '<div class="note" style="padding:0 16px 10px">这个视频已经在列表里了</div>';
        setTimeout(()=>$('#prog').innerHTML='', 2600);
      }else{
        videos.push(v); drawList();
        // 多选模式下新导入的素材应该加进选择，而不是把已选的全顶掉
        choose(videos.length-1, multiMode);
      }
      fin();
    }else{
      let m=t('upfail'); try{ m=JSON.parse(xhr.responseText).detail||m; }catch(e){}
      err(m);
    }
  };
  xhr.onerror = ()=>err(t('upfail'));    // err 里已经 fin()
  const fd=new FormData(); fd.append('file',f); xhr.send(fd);
}

// 顺序上传而不是并发：并发几个几百 MB 的文件会互相抢带宽，
// 进度条也没法表达「第几个」。
async function uploadAll(files){
  for(const f of [...files]) await new Promise(done => upload(f, done));
}
$('#file').onchange = e => { uploadAll(e.target.files); e.target.value=''; };
const S=$('#side');
['dragenter','dragover'].forEach(k=>S.addEventListener(k,e=>{
  e.preventDefault(); S.classList.add('drop'); }));
['dragleave','drop'].forEach(k=>S.addEventListener(k,e=>{
  e.preventDefault(); S.classList.remove('drop'); }));
S.addEventListener('drop', e => uploadAll(e.dataTransfer.files));

function applyLang(){
  document.documentElement.lang = LANG==='zh' ? 'zh-CN' : 'en';
  $('#lang').textContent = LANG==='zh' ? 'EN' : '中';
  $('#tagline').textContent = t('tagline');
  $('#lbl-videos').textContent = t('videos');
  $('#uptxt').textContent = t('pick');
  syncMulti();
  drawList();
  if(cur) draw(); else blank('▤', t('blank'), t('blankSub'));
}
$('#lang').onclick = ()=>{
  LANG = LANG==='zh' ? 'en' : 'zh';
  localStorage.setItem('pipo_lang', LANG);
  applyLang();
};

fetch('/api/me').then(r=>r.ok?r.json():null).then(m=>{
  if(m) $('#who').textContent = m.name;
});
$('#signout').onclick = async ()=>{
  await fetch('/api/logout',{method:'POST'});
  location.href = '/login.html';
};
boot().then(applyLang);

<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipo AI</title>
<style>
/* ── 设计系统 ─────────────────────────────────────────────
   间距 4/8/12/16/20/32，字号 11.5/12.5/13/15/17
   中性色偏暖；强调色只出现在「当前选中」和「主操作」两处，不滥用 */
:root{
  --bg:#f7f7f6; --surface:#fff; --surface-2:#fafaf9;
  --line:#e8e6e3; --line-2:#d6d3cf;
  --ink:#18181b; --ink-2:#52525b; --ink-3:#8b8782;
  --accent:#2563eb; --on-accent:#fff; --accent-wash:#eff4ff; --accent-line:#bfd3fe;
  --warn:#b45309; --warn-wash:#fffbeb;
  --r-sm:6px; --r:10px; --r-lg:14px;
  --shadow:0 1px 2px rgba(24,24,27,.04),0 4px 12px rgba(24,24,27,.05);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0f1012; --surface:#17181b; --surface-2:#1c1e21;
    --line:#26282c; --line-2:#34373c;
    --ink:#f4f4f5; --ink-2:#a1a1aa; --ink-3:#71717a;
    --accent:#5b8dff; --on-accent:#0b1220; --accent-wash:#161d2e; --accent-line:#2b3d63;
    --warn:#f0b429; --warn-wash:#1f1a0e;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 12px rgba(0,0,0,.25);
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB",
       "Segoe UI","Helvetica Neue",sans-serif;
  -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,label{font-family:inherit}
::selection{background:var(--accent-wash)}

.top{height:60px;padding:0 24px;border-bottom:1px solid var(--line);
  background:var(--surface);display:flex;align-items:center;gap:12px;
  position:sticky;top:0;z-index:20}
.logo{width:26px;height:26px;border-radius:7px;background:var(--accent);
  display:grid;place-items:center;color:var(--on-accent);font-size:14px;font-weight:700}
/* 品牌标记：一颗球加两道拖影。不用字母 —— 「P」既不说明这是乒乓球，
   也不说明它在动。两道拖影长短不同、透明度递增，读起来是加速而不是平移；
   球放在轨迹前端，方向感来自这个位置关系而不是箭头。
   用 currentColor，深浅色主题和不同背景上都不用另配一份。 */
.logo svg{width:60%;height:60%;display:block;overflow:visible}
.brand{font-size:15px;font-weight:640;letter-spacing:-.01em}
.tag{font-size:12.5px;color:var(--ink-3);padding-left:12px;
  border-left:1px solid var(--line)}
.who{font-size:12.5px;color:var(--ink-3)}
.status{margin-left:auto;display:flex;align-items:center;gap:8px;
  font-size:12.5px;color:var(--ink-2);
  border:1px solid var(--line);background:var(--surface-2);
  border-radius:999px;padding:5px 14px 5px 11px;
  opacity:0;transform:translateY(-4px);pointer-events:none;
  transition:opacity .22s ease,transform .22s ease}
.status[data-on]{opacity:1;transform:none;pointer-events:auto}
.status[data-on="done"]{border-color:var(--accent-line);background:var(--accent-wash);
  color:var(--accent);cursor:pointer}
.status[data-on="fail"]{border-color:var(--warn);background:var(--warn-wash);color:var(--warn)}
.status .dot{width:14px;height:14px;flex:0 0 auto}
.status b{font-weight:620;font-variant-numeric:tabular-nums}
.lang{border:1px solid var(--line-2);background:transparent;
  color:var(--ink-3);border-radius:999px;padding:4px 12px;font-size:12px;
  cursor:pointer;transition:all .12s ease;font-variant:tabular-nums}
.lang:hover{border-color:var(--accent);color:var(--accent)}

.shell{display:grid;grid-template-columns:280px minmax(0,1fr);height:calc(100% - 60px)}
.side{border-right:1px solid var(--line);background:var(--surface);
  display:flex;flex-direction:column;min-height:0}
.side-hd{padding:16px 16px 12px;display:flex;align-items:center;
  justify-content:space-between;gap:8px}
.side-body{overflow-y:auto;padding:0 12px 16px;flex:1;min-height:0}
.stage-wrap{overflow-y:auto;min-height:0}
.stage{max-width:1240px;margin:0 auto;padding:32px 32px 64px}
/* **一栏到底。** 曾经是左栏放决定（顺序、主题）、右栏放预览，
   但实测单选时左栏只剩一张主题卡片，内容高 271px 而可视高 800px，
   下面空 529px；而把顺序条挪到播放器下面之后，多选时也是同样的空。
   现在的顺序就是操作顺序：看画面 → 排素材 → 选主题 → 开始剪。 */
.one{max-width:860px;margin:0 auto}
@media (max-width:1080px){ .stage{max-width:860px} }
.eyebrow{font-size:11px;font-weight:660;letter-spacing:.06em;color:var(--ink-3)}

.item{display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  border:1px solid transparent;background:transparent;color:inherit;font:inherit;
  padding:8px 10px;border-radius:var(--r);cursor:pointer;margin-bottom:2px;
  transition:background .12s ease,border-color .12s ease}
.item:hover{background:var(--surface-2)}
.item[aria-selected="true"]{background:var(--accent-wash);border-color:var(--accent-line)}
/* 缩略图固定 4:3 框：素材有横有竖，不固定框列表左缘会参差不齐 */
.item .th{width:52px;height:39px;flex:0 0 auto;object-fit:cover;border-radius:6px;
  background:var(--line);display:block}
.item .meta{min-width:0;flex:1}
.item .t{display:-webkit-box;font-size:13px;line-height:1.4;word-break:break-all;
  -webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item .s{display:block;font-size:11.5px;color:var(--ink-3);margin-top:2px;
  font-variant-numeric:tabular-nums}

.up{border:1px solid var(--line-2);border-radius:999px;padding:5px 12px;
  font-size:12px;cursor:pointer;color:var(--ink-2);background:var(--surface);
  white-space:nowrap;transition:all .12s ease}
.up:hover{border-color:var(--accent);color:var(--accent)}
.up[data-busy="1"]{opacity:.55;pointer-events:none}
/* 导入是主操作 —— 列表空的时候它是唯一能干的事，得一眼看到。
   多选是次操作，保持描边。 */
.up.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);
  font-weight:560}
.up.primary:hover{filter:brightness(1.08);color:var(--on-accent)}
/* 多选激活用淡色底而不是实心：两个实心按钮并排会互相抢，
   但又必须看得出是「按下」状态 —— 否则用户不知道当前点击会叠加还是替换。 */
.up[aria-pressed="true"]{background:var(--accent-wash);border-color:var(--accent);
  color:var(--accent);font-weight:560}
.item .ck{width:16px;height:16px;border:1.5px solid var(--line-2);
  border-radius:4px;display:grid;place-items:center;
  font-size:10px;line-height:1;color:transparent;flex:0 0 auto}
.item[aria-selected="true"] .ck{border-color:var(--accent);background:var(--accent);
  color:var(--on-accent)}
.prog{height:2px;background:var(--line);border-radius:2px;overflow:hidden;margin:0 16px 10px}
.prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .12s}
.side.drop{outline:2px dashed var(--accent);outline-offset:-10px;background:var(--accent-wash)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:var(--shadow);margin-bottom:20px;overflow:hidden}
.card-pad{padding:20px}
.card-hd{padding:15px 20px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:12px}
.card-hd h3{margin:0;font-size:14px;font-weight:620;letter-spacing:-.005em}

.player{background:#000;display:grid;place-items:center;min-height:180px}
/* 连播时告诉用户现在是第几段 —— 否则画面一换会以为是 bug */
.nowplay{padding:9px 20px;font-size:12.5px;color:var(--ink-3);
  background:var(--surface-2);border-top:1px solid var(--line);
  font-variant-numeric:tabular-nums}
video{max-width:100%;display:block}

/* 素材信息一行带过。ⓘ 那条超出就省略，完整内容在 title 里 ——
   它是「知道一下」级别的提示，不该占三行高度。 */
.factline{display:flex;align-items:center;gap:8px;padding:11px 20px;
  border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);
  white-space:nowrap;overflow:hidden}
.factline b{font-weight:620;color:var(--ink);font-variant-numeric:tabular-nums}
.factline i{width:1px;height:11px;background:var(--line-2);flex:0 0 auto}
.factline .fact-note{min-width:0;overflow:hidden;text-overflow:ellipsis}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));
  border-top:1px solid var(--line)}
.metric{padding:14px 20px;border-right:1px solid var(--line)}
.metric:last-child{border-right:0}
.metric b{display:block;font-size:17px;font-weight:640;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.35}
.metric span{font-size:11.5px;color:var(--ink-3)}

/* 主题名排成一行，说明统一显示在下方 —— 说明写进按钮会让宽度参差、换行成好几排 */
/* **换行，不横向滚动。** 一共就五个固定主题，实测默认窗口（1280）下
   需要 426px 而只有 405px，最后四个全被裁掉 —— 让人横向滚动去找一个
   五选一的选项是没道理的。换行最多占两排，一眼全见。 */
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:2px 0 4px}
.chip{flex:0 0 auto;white-space:nowrap;border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink-2);border-radius:999px;
  padding:7px 15px;font-size:13px;font-weight:500;cursor:pointer;
  transition:all .14s cubic-bezier(.2,.7,.3,1)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);
  color:var(--on-accent);font-weight:560}
.desc{color:var(--ink-2);font-size:13px;margin-top:14px;min-height:1.6em}
.est{color:var(--ink-3)}

/* 素材顺序：横向缩略图条，拖动改顺序。
   给了画面才谈得上「排序」—— 只有文件名的话用户是在猜。 */
.ord{display:flex;gap:10px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:thin}
.ord-i{flex:0 0 auto;width:108px;cursor:grab;position:relative;
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;
  background:var(--surface-2);transition:border-color .12s ease,opacity .12s ease}
.ord-i:active{cursor:grabbing}
.ord-i.drag{opacity:.35}
.ord-i.over{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-wash)}
.ord-i.now{border-color:var(--accent);background:var(--accent-wash)}
.ord-i.now .nm{color:var(--accent)}
.ord-i img{width:100%;height:76px;object-fit:cover;display:block;background:var(--line)}
.ord-i .n{position:absolute;top:5px;left:5px;min-width:18px;height:18px;padding:0 5px;
  border-radius:9px;background:var(--accent);color:var(--on-accent);
  font-size:11px;font-weight:640;display:grid;place-items:center;
  font-variant-numeric:tabular-nums}
.ord-i .nm{display:block;padding:5px 7px 6px;font-size:11px;color:var(--ink-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.btn{border:0;border-radius:var(--r);padding:10px 22px;font-size:14px;font-weight:560;
  cursor:pointer;background:var(--accent);color:var(--on-accent);
  transition:filter .12s ease,transform .06s ease}
.btn:hover:not(:disabled){filter:brightness(1.08)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn:disabled{opacity:.45;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line-2);
  padding:6px 14px;font-size:13px;text-decoration:none;display:inline-block}
.btn.ghost:hover{border-color:var(--accent);filter:none}

.note{font-size:12.5px;color:var(--ink-3);line-height:1.55}
.alert{display:flex;gap:8px;align-items:flex-start;background:var(--warn-wash);
  color:var(--warn);font-size:12.5px;padding:10px 14px;border-radius:var(--r-sm);
  line-height:1.5}
/* 只影响观感的提示用中性色 —— 和「没音轨、根本剪不了」用同一个黄色警告，
   等于告诉用户每段素材都有问题，久了就没人看了 */
.alert.info{background:var(--surface-2);color:var(--ink-2)}
.run{display:flex;align-items:center;gap:11px;font-size:13.5px;color:var(--ink-2)}
.pctn{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink-3);font-size:12.5px}
.bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--accent);width:0;
  transition:width .35s cubic-bezier(.3,.7,.3,1)}
.spin{width:15px;height:15px;border:2px solid var(--line-2);
  border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* 侧栏底栏：语言和 𝕏 这类「用不到但要找得到」的东西。
   放顶栏会和品牌区抢注意力 —— 顶栏应该只说「这是什么」，
   而这两个是随时可点、平时不看的工具，属于角落。 */
.side-foot{margin-top:auto;padding:12px 16px;border-top:1px solid var(--line);
  display:flex;align-items:center;gap:8px}
/* 首屏：一个视频都没有时，侧栏列表是空的，藏起来让导入入口独占视线。
   **但底栏留着** —— 否则第一次打开的人找不到语言开关，
   而首屏恰恰是最需要它的时候（英文用户看到的是一屏中文）。 */
body[data-view="landing"] .side-hd,
body[data-view="landing"] .side-body,
body[data-view="landing"] #multihint,
body[data-view="landing"] #prog{display:none}
body[data-view="landing"] .side{border-right:0;background:transparent}
body[data-view="landing"] .side-foot{border-top:0}
body[data-view="landing"] .shell{grid-template-columns:180px minmax(0,1fr)}
.hero{max-width:520px;margin:0 auto;padding:64px 24px;text-align:center}
/* 首屏是「还没有素材」的状态，本来就没什么可看的 —— 一个弹跳的球
   让这一屏有个活物，同时一眼说明这是乒乓球工具。
   纯 CSS，不引外部资源（app 是离线的）。 */
.hero-ball{position:relative;width:64px;height:74px;margin:0 auto 20px}
.ball{position:absolute;left:50%;top:0;width:28px;height:28px;margin-left:-14px;
  border-radius:50%;
  /* 球的高光偏左上，和下面阴影的方向一致，否则看起来像贴纸 */
  background:radial-gradient(circle at 34% 30%, #fff 0%, #ffc46b 42%, #f59e0b 78%, #c2670a 100%);
  animation:ball-drop .62s cubic-bezier(.35,0,.7,1) infinite alternate}
.ball-shadow{position:absolute;left:50%;bottom:4px;width:30px;height:7px;
  margin-left:-15px;border-radius:50%;background:#000;opacity:.28;
  filter:blur(2.5px);
  animation:ball-shade .62s cubic-bezier(.35,0,.7,1) infinite alternate}
/* 落到底时压扁一点。真实的乒乓球几乎不形变，但没有这一下，
   动画看起来像是「悬浮」而不是「砸在台面上」。 */
@keyframes ball-drop{
  0%   {transform:translateY(0) scale(1,1)}
  82%  {transform:translateY(38px) scale(1,1)}
  92%  {transform:translateY(42px) scale(1.14,.84)}
  100% {transform:translateY(38px) scale(1,1)}
}
@keyframes ball-shade{
  0%   {transform:scale(.6);opacity:.14}
  100% {transform:scale(1);opacity:.32}
}
/* 有人对动效敏感，也有人只是不想要 —— 尊重系统设置，静止显示 */
@media (prefers-reduced-motion:reduce){
  .ball{animation:none;transform:translateY(38px)}
  .ball-shadow{animation:none}
}
.hero h1{margin:0 0 8px;font-size:26px;font-weight:660;letter-spacing:-.02em}
.hero-sub{margin:0 0 32px;color:var(--ink-3);font-size:14px}
.hero-drop{display:block;border:2px dashed var(--line-2);border-radius:var(--r-lg);
  padding:44px 24px;cursor:pointer;background:var(--surface);
  transition:border-color .14s ease,background .14s ease}
.hero-drop:hover,.hero-drop.over{border-color:var(--accent);background:var(--accent-wash)}
.hero-ic{font-size:26px;color:var(--accent);line-height:1;margin-bottom:12px}
.hero-cta{font-size:16px;font-weight:600}
.hero-hint{font-size:12.5px;color:var(--ink-3);margin-top:6px}
.hero-quota{font-size:12.5px;color:var(--ink-3);margin-top:18px}
/* 𝕏 和语言都在侧栏底栏（见 .side-foot） */
.xlink{display:grid;place-items:center;width:28px;height:28px;border-radius:999px;
  border:1px solid var(--line-2);color:var(--ink-3);text-decoration:none;
  font-size:13px;font-weight:700;transition:all .12s ease}
.xlink:hover{border-color:var(--accent);color:var(--accent)}
/* 删完之后就地问一句，不弹窗、不挡路。12 秒没人理就自己消失。 */
.why{display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  padding:9px 12px;background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r);font-size:12.5px;color:var(--ink-2)}
.why button{width:auto;margin:0;padding:4px 10px;font-size:12px;border-radius:999px;
  border:1px solid var(--line-2);background:transparent;color:var(--ink-2);cursor:pointer}
.why .why-yes{border-color:var(--accent);color:var(--accent)}
.why button:hover{filter:none;border-color:var(--accent);color:var(--accent)}
/* 出片后收起原片：成片才是这时候要看的东西。留一个开关能调回来比对。 */
body[data-cut="1"] #srcwrap{display:none}
/* #cut 和 #out 在 .one 外面，不跟着限宽的话成片卡片会比下面的
   主题卡片宽一截，边缘对不齐 */
#cut, #out{max-width:860px;margin-left:auto;margin-right:auto}
.srcline{margin:-6px 0 20px;text-align:center}
.srcline button{width:auto;margin:0;padding:5px 14px;font-size:12px;border-radius:999px;
  border:1px solid var(--line-2);background:transparent;color:var(--ink-3);cursor:pointer}
.srcline button:hover{filter:none;border-color:var(--accent);color:var(--accent)}
/* 设置面板 */
.sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.35);
  display:grid;place-items:center;padding:24px}
.sheet-box{width:min(560px,100%);max-height:86vh;overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);
  box-shadow:0 20px 60px rgba(0,0,0,.28)}
.sheet-hd{display:flex;align-items:center;justify-content:space-between;
  padding:16px 20px;border-bottom:1px solid var(--line)}
.sheet-hd h3{margin:0;font-size:14px;font-weight:620}
.sheet-body{padding:20px}
.pref-t{font-size:14px;font-weight:620;margin-bottom:6px}
.pref-d{margin:0 0 16px;font-size:13px;color:var(--ink-2);line-height:1.65}
.pref-lists{display:grid;grid-template-columns:1fr 1fr;gap:16px;
  background:var(--surface-2);border:1px solid var(--line);
  border-radius:var(--r);padding:14px 16px}
.pref-lists b{font-size:11.5px;font-weight:660;color:var(--ink-3);
  letter-spacing:.04em}
.pref-lists ul{margin:8px 0 0;padding-left:16px;font-size:12.5px;
  color:var(--ink-2);line-height:1.75}
.pref-n{margin:14px 0 0;font-size:12.5px;color:var(--ink-3)}
.pref-acts{display:flex;gap:8px;margin-top:16px}
.pref-acts .btn{width:auto;margin:0}
.blank{text-align:center;padding:96px 24px;color:var(--ink-3)}
.blank .ic{font-size:28px;line-height:1;margin-bottom:14px;opacity:.45}
.blank p{margin:0;font-size:14px}
.blank .sub{font-size:12.5px;margin-top:6px;opacity:.8}
.sk{background:linear-gradient(90deg,var(--line) 25%,var(--surface-2) 50%,var(--line) 75%);
  background-size:200% 100%;animation:sh 1.3s ease-in-out infinite;border-radius:var(--r-sm)}
@keyframes sh{to{background-position:-200% 0}}

// 任何接口返回 401 都说明 cookie 没了或失效，统一跳登录页 ——

// 424 = 缺按需下载的模型。任何入口碰到都弹同一个下载面板 ——
// 分散在每个调用点各写一次，迟早会漏掉一个。
const _fetch = window.fetch;
window.fetch = async (...a) => {
  const r = await _fetch(...a);
  if(r.status === 401) location.href = '/login.html';
  // 424 = 缺按需下载的模型。在拦截层统一接住，导入和剪辑两个入口都能弹 ——
  // 分散到每个调用点各写一次，迟早漏掉一个，而漏掉的那个会静默降级。
  if(r.status === 424){
    const c = r.clone();
    c.json().then(j => needAssets(j.detail)).catch(() => needAssets());
  }
  return r;
};

const $ = s => document.querySelector(s);
const el = (t,c,h) => { const e=document.createElement(t);

// 先对总秒数取整再拆分。写成 Math.round(s%60) 会让 119.7s 显示成 1:60
const mmss = s => { const t = Math.round(s);
  return `${Math.floor(t/60)}:${String(t%60).padStart(2,'0')}`; };
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function boot(){
  $('#list').innerHTML = '<div class="sk" style="height:50px;margin:2px 0"></div>'.repeat(4);
  blank('▤',t('blank'),t('blankSub'));
  try{
    [videos, themes] = await Promise.all([
      fetch('/api/videos').then(r=>r.json()),
      fetch('/api/themes').then(r=>r.json())]);
  }catch(e){
    $('#list').innerHTML=`<div class="note" style="padding:0 12px">${t('nobackend')}</div>`; return;
  }
  try{ me = await fetch('/api/me').then(r=>r.ok?r.json():null); }catch(e){ me=null; }
  drawList();
  // 有素材就直接选中最新导入的那个（接口按 created DESC 返回，videos[0] 即最新）。
  // 否则打开 app 是一片「选一段录像开始」的空白 —— 而右边本来就该显示点什么，
  // 让人先看到画面再决定，比先看到一句提示再去点一下要短一步。
  if(videos.length) choose(0);

// 桌面版：把「选文件」从浏览器的文件框换成系统选择器。
//
// 用**事件委托 + 捕获阶段**，不是给节点各绑一个：#herodrop 是 landing()
// 每次重画时新建的，直接绑会在重画后失效，表现是「点第一次好使，
// 回到首屏再点就没反应」。委托到 document 上就不受重画影响。
// preventDefault 必须在捕获阶段发生 —— #up 是个 <label>，
// 不拦住它会连带触发里面隐藏的 <input type=file>，两个选择器一起弹出来。
function appMode(){
  document.body.dataset.app='1';
  // 顶栏这两个是 SaaS 遗留：本地版只有一个用户（「本机」是句废话），
  // 也没有会话可以退出（点了会去调 /api/logout，然后什么也不会发生）。
  $('#who')?.remove();
  $('#signout')?.remove();
  document.addEventListener('click', e => {
    if(e.target.closest && e.target.closest('#up, #herodrop')){
      e.preventDefault(); e.stopPropagation(); pickLocal(); return;
    }
    const rv = e.target.closest && e.target.closest('[data-reveal]');
    if(rv){ e.preventDefault(); revealOut(rv.dataset.reveal); }
  }, true);
}

// 成片在磁盘上的哪儿，前端不该知道（out/ 的位置是后端的事），
// 所以拿 /media/xxx 去问后端要真实路径，再交给原生侧在访达里选中。
async function revealOut(url){
  try{
    const r = await fetch('/api/local/path?url='+encodeURIComponent(url));
    const d = await r.json();
    if(d.path) await window.pywebview.api.reveal(d.path);
    else addNote('找不到这个文件', true);
  }catch(e){ addNote('打不开访达', true); }
}

      `<img class="th" src="/api/thumb?id=${encodeURIComponent(v.id)}"
            alt="" loading="lazy" onerror="this.style.visibility='hidden'">
       <span class="meta">
         <span class="t">${esc(shotLabel(v))}</span>
         <span class="s">${esc(shortName(v.name))} · ${mmss(v.duration)}</span>
       </span>
       ${multiMode?'<span class="ck">✓</span>':''}`);
    b.setAttribute('role','option');
    b.title = v.name;          // 文件名退到 tooltip，需要时还能查
    b.setAttribute('aria-selected', sel.includes(v.id) ? 'true':'false');
    // 多选模式下点击即切换；平时点击=只选这个，保持单选手感 ——
    // 反过来做会让「换一个视频」变成先取消再选的两步。
    // ⌘/Ctrl/Shift 作为熟手快捷方式一直有效。
    b.onclick = e => choose(i, multiMode||e.metaKey||e.ctrlKey||e.shiftKey);
    L.appendChild(b);
  });
}

function selKey(){ return picked().map(v=>v.id).join(','); }

// 多选时把预览播成一条连续的片子。<video> 没有原生播放列表，
// 所以在 ended 时换 src 再 play() —— 切换会有一瞬黑屏，但比让用户
// 自己一个个点开看要好。单选时这个函数什么都不做。
let plIdx = 0;              // 连播到第几段（顺序条点击也要能改，所以放外层）
function playAt(n, autoplay){
  const P=picked(), vid=$('#stage video'), box=$('#nowplay');
  if(!vid || !P.length) return;
  plIdx = Math.max(0, Math.min(n, P.length-1));
  vid.src = '/source?id=' + encodeURIComponent(P[plIdx].id);
  vid.load();
  if(box) box.textContent = t('nowPlaying', plIdx+1, P.length, shotLabel(P[plIdx]));
  if(autoplay) vid.play().catch(()=>{});     // 自动播放被拦就算了，用户点一下即可
  drawOrder();                               // 刷新顺序条的「正在播」高亮
}
function wirePlaylist(){
  const P=picked(), vid=$('#stage video');
  if(!vid || P.length<2) return;
  // drawOrder 已经在本函数之前跑过了，那时 plIdx 可能还停在上一次选择的位置，
  // 所以重置之后要再画一次，否则「正在播」高亮会落在错的缩略图上
  plIdx = 0;
  drawOrder();
  const box=$('#nowplay');
  if(box) box.textContent = t('nowPlaying', 1, P.length, shotLabel(P[0]));
  // 播完自动接下一段。<video> 没有原生播放列表，只能换 src 再 play()。
  // 切换会有一瞬黑屏，但比让用户自己一个个点开看要好。
  vid.onended = () => { if(plIdx < P.length-1) playAt(plIdx+1, true); };
}

function paintDesc(){
  const box=$('#desc'); if(!box) return;
  const all=[{id:'auto'}, ...themes];
  const base = pickTheme==='auto' ? t('autoDesc')
             : (themeDesc(themes.find(x=>x.id===pickTheme)||{}) || '');
  let tail='';
  if(est && estKey===selKey()){
    const e=est[pickTheme];
    if(e && e.parts) tail = ' · ' + t('estPair',
      e.parts[0].clips, mmss(e.parts[0].seconds),
      e.parts[1].clips, mmss(e.parts[1].seconds));
    else if(e) tail = ' · ' + t('estOne', e.clips, mmss(e.seconds));
  } else if(estBusy){
    tail = ' · ' + t('estWait');
  }
  box.innerHTML = esc(base) + (tail?`<span class="est">${esc(tail)}</span>`:'');
}

async function loadEst(){
  const key = selKey();
  if(!key || key===estKey) return;
  estBusy = true; est = null; paintDesc();
  try{
    const r = await fetch('/api/estimate',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({videos:picked().map(v=>v.id), ordered:true, top:10})})
      .then(x=>x.ok?x.json():null);
    // 请求飞在路上时用户可能又改了选择，回来的就不是当前这组素材了
    if(selKey()!==key) return;
    est = r ? r.themes : null; estKey = key;
  }catch(e){ est = null; }
  finally{ estBusy = false; paintDesc(); }
}

// 素材顺序条：拖动改接续顺序。用 HTML5 drag 而不是自己算指针位移 ——
// 后者要处理滚动、触摸、边界，代码量翻几倍而收益只是动画更顺。
function drawOrder(){
  const box = $('#ord');
  if(!box) return;
  box.innerHTML = '';
  picked().forEach((v, i) => {
    const d = el('div','ord-i',
      `<span class="n">${i+1}</span>
       <img src="/api/thumb?id=${encodeURIComponent(v.id)}" alt=""
            onerror="this.style.visibility='hidden'">
       <span class="nm">${esc(shotLabel(v))}</span>`);
    d.draggable = true;
    d.title = v.name;
    d.dataset.id = v.id;
    if(picked().length>1 && i===plIdx) d.classList.add('now');
    // 有缩略图却不能点是反直觉的 —— 点一下就跳到那一段
    d.onclick = e => { if(!e.target.closest('.n')) playAt(i, true); };
    d.ondragstart = e => { e.dataTransfer.effectAllowed='move';
      e.dataTransfer.setData('text/plain', v.id); d.classList.add('drag'); };
    d.ondragend   = () => d.classList.remove('drag');
    d.ondragover  = e => { e.preventDefault(); d.classList.add('over'); };
    d.ondragleave = () => d.classList.remove('over');
    d.ondrop = e => {
      e.preventDefault(); d.classList.remove('over');
      const from = sel.indexOf(e.dataTransfer.getData('text/plain'));
      const to   = sel.indexOf(v.id);
      if(from < 0 || to < 0 || from === to) return;
      sel.splice(to, 0, sel.splice(from, 1)[0]);
      reordered = true;      // 用户表过态了，之后加选不再自动重排
      draw();
    };
    box.appendChild(d);
  });
}

function blank(ic,msg,sub){
  $('#stage').innerHTML = `<div class="blank"><div class="ic">${ic}</div><p>${msg}</p>
    ${sub?`<div class="sub">${sub}</div>`:''}</div>`;
}

// 一个视频都没有时，工作台上的东西全是空的（顺序、主题、播放器都没意义）。
// 所以首屏只留一件事：把视频放进来。分析完再进工作台。
function landing(){
  document.body.dataset.view='landing';
  $('#stage').innerHTML = `
    <div class="hero">
      <div class="hero-ball" aria-hidden="true">
        <span class="ball"></span><span class="ball-shadow"></span>
      </div>
      <h1>${t('heroTitle')}</h1>
      <p class="hero-sub">${t('heroSub')}</p>
      <label class="hero-drop" id="herodrop">
        <div class="hero-ic">↑</div>
        <div class="hero-cta">${t('heroCta')}</div>
        <div class="hero-hint">${isApp()?t('heroHintApp'):t('heroHint')}</div>
      </label>
      <div id="heroprog"></div>
      <p class="hero-quota" id="heroquota"></p>
    </div>`;
  // 复用侧栏那个 <input type=file>，上传逻辑只有一份
  $('#herodrop').onclick = () => $('#file').click();
  const S=$('#stage');
  ['dragenter','dragover'].forEach(k=>S.addEventListener(k,e=>{
    e.preventDefault(); $('#herodrop')?.classList.add('over'); }));
  ['dragleave','drop'].forEach(k=>S.addEventListener(k,e=>{
    e.preventDefault(); $('#herodrop')?.classList.remove('over'); }));
  S.addEventListener('drop', e => uploadAll(e.dataTransfer.files));
  paintQuota();
}
function paintQuota(){
  const box=$('#heroquota'); if(!box || !me) return;
  box.textContent = me.left==null ? '' : t('quotaLeft', me.left, me.quota);
}

function choose(i, add){
  setStatus(null);          // 换素材了，上一次的完成提示就过期了
  pauseSource();            // 旧素材可能正在放，换之前先停
  const v = videos[i];
  if(add){
    if(sel.includes(v.id)){
      if(sel.length>1) sel = sel.filter(x=>x!==v.id);   // 不允许清空到零
    } else {
      sel.push(v.id); sortSel();      // 新加的按拍摄时间落到该在的位置
    }
  } else {
    sel = [v.id];
  }
  // cur 是「面板上显示哪一段」：加选时保持不动，单选时跟着走。
  if(!cur || !sel.includes(cur.id)) cur = picked()[0];
  [...$('#list').children].forEach((e,j)=>
    e.setAttribute('aria-selected', sel.includes(videos[j].id)?'true':'false'));
  syncMulti();
  draw();
}

// sel 是**有序**的 id 数组：成片的接续顺序就是它，所以不能用 Set。
// 存 id 不存对象 —— 上传后 videos 会整个重建，存引用会让选中态凭空丢失。
function picked(){ return sel.map(id=>videos.find(v=>v.id===id)).filter(Boolean); }

// 素材的主标签用拍摄时间，不用文件名。
// 文件名基本都是 dc393956ce8c… 这类哈希，用户分不出哪段是哪段；
// 而「7月27日 15:53」立刻能对上是哪次训练。
// 同一堂课分段录的素材，拍摄时间可能只差几分钟（实测两条是 09:10 和 09:22），
// 一列看下来几乎一样。文件名原来只在 tooltip 里 —— 那要悬停才看得到。
// 分辨率移到右侧面板去了，这里让位给文件名。
function shortName(n){
  const base = String(n||'').replace(/\.[^.]+$/,'');
  return base.length > 22 ? base.slice(0,10)+'…'+base.slice(-8) : base;
}
function shotLabel(v){
  if(!v.shot_at) return v.name;
  const d = new Date(v.shot_at*1000);
  const hm = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  return LANG==='en'
    ? d.toLocaleDateString('en-US',{month:'short',day:'numeric'})+', '+hm
    : (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
}
// 「素材没问题」不该显示成警告条。老记录里存的是旧文案，一并认掉。
const NOTE_OK = ['视频质量良好','素材没问题，可以直接剪','Looks good','Good to go',''];
function noteOf(v){
  const n = LANG==='en' ? (v.note_en||v.note) : v.note;
  if(!n || NOTE_OK.includes(n) || NOTE_OK.includes(v.note)) return null;
  // 没音轨是唯一真正挡路的问题 —— 其它都只影响观感，不该用同一个红色警告
  return {text:n, blocking:/没有音轨|无音轨|No audio track/.test(n)};
}
// 默认按拍摄时间；用户拖动调整后不再自动重排（reordered 置位）。
let reordered=false;
function sortSel(){
  if(reordered) return;
  const at=id=>(videos.find(v=>v.id===id)||{}).shot_at||0;
  sel.sort((a,b)=>at(a)-at(b));
}

// 「多选素材」开关：在已导入的素材里挑几段一起剪。
// 做成显式模式而不是只靠 ⌘ —— 修饰键是隐藏交互，没人会去猜。
function syncMulti(){
  const b=$('#multi');
  b.setAttribute('aria-pressed', multiMode?'true':'false');
  $('#multitxt').textContent = multiMode
    ? t('selDone').replace('%d', picked().length) : t('selMode');
  b.style.display = videos.length > 1 ? '' : 'none';
  $('#multihint').textContent =
    videos.length < 2 ? '' : (multiMode ? t('multiOn') : t('multiHint'));
}
$('#multi').onclick = ()=>{
  multiMode = !multiMode;
  drawList(); syncMulti();
};

/* 原生菜单里只留「播放速度」：下载在卡片上已有独立入口，重复了。
   #t=0.5 让浏览器解码并显示首帧 —— 否则 preload=metadata 下播放器是一片纯黑，
   看起来像加载失败。 */
// 源片预览的任务只是「确认是这段素材」，不是观看 —— 它高一点，
// 下面的主题条和「开始剪辑」就掉出首屏（实测竖屏 380 时主题条在 1007px，
// 而可视区只有 800）。成片播放器不受这里影响，它单独更高。
function player(src, portrait){
  const poster = src + (src.includes('#') ? '' : '#t=0.5');
  return `<div class="player"><video src="${poster}" controls
    controlslist="nodownload noremoteplayback" disablepictureinpicture
    preload="metadata" style="max-height:${portrait?300:260}px"></video></div>`;
}

function draw(){
  const P=picked(), multi=P.length>1;
  // 多选时预览按顺序连续播放，第一段先出画。单选时就是 cur 本身。
  const v = multi ? P[0] : cur;
  const portrait=v.height>v.width;
  const total = P.reduce((a,x)=>a+x.duration, 0);
  // 单选走单栏（画面在上、主题在下），多选才分两栏 —— 那时左栏有顺序条，撑得起来
  const themeCard = `
        <div class="card">
          <div class="card-hd"><h3>${t('theme')}</h3>${multi
            ? `<span class="who">${t('multiSel')
                 .replace('%d', P.length)
                 .replace('%s', mmss(total))}</span>`
            : ''}</div>
          <div class="card-pad">
            <div class="chips" id="chips" role="group" aria-label="剪辑主题"></div>
            <div class="desc" id="desc"></div>
            <div style="margin-top:20px"><button class="btn" id="go">${t('go')}</button></div>
          </div>
        </div>`;
  // 「质量评分」去掉了：那是个启发式分数（100 分减去分辨率/帧率/竖屏各扣几分），
  // 不是测出来的东西，和已经下线的拍数、回合数是同一类。下面那条提示已经把
  // 该说的说清楚了（「分辨率偏低，不影响剪得准不准」），分数只是多一层噪音。
  // 时长和分辨率压成一行小字，不再用大数字块：这两个数侧栏列表每一条上
  // 已经写着了，在这儿用 17px 粗体重复一遍只是占位置 —— 实测那两块加上
  // 质量提示占了播放器卡片 604px 中的近 200px，把「开始剪辑」顶出首屏。
  // 挡路的问题（没音轨）仍然单独用警告条，那个必须显眼。
  const n = noteOf(v);
  const playerCard = `
        <div class="card">
          ${player('/source?id='+v.id, portrait)}
          ${multi ? `<div class="nowplay" id="nowplay"></div>` : ''}
          <div class="factline">
            <b>${mmss(multi?total:v.duration)}</b>
            <span>${multi ? t('durationAll') : t('duration')}</span>
            <i></i><b>${v.width}×${v.height}</b>
            ${n && !n.blocking ? `<i></i><span class="fact-note" title="${esc(n.text)}">ⓘ ${esc(n.text)}</span>` : ''}
          </div>
          ${n && n.blocking ? `<div class="card-pad" style="padding-top:0">
                 <div class="alert"><span>⚠</span><span>${esc(n.text)}</span></div></div>` : ''}
        </div>`;
  const orderCard = !multi ? '' : `
        <div class="card">
          <div class="card-hd"><h3>${t('order')}</h3>
            <span class="who">${reordered?t('orderManual'):t('orderAuto')}</span></div>
          <div class="card-pad"><div class="ord" id="ord"></div></div>
        </div>`;
  // 剪完之后成片才是主角，所以 #cut 放在最前面 —— 它会占据原片播放器的位置。
  // 原片卡片包在 #srcwrap 里，出片后收起（还能用「原片」开关调回来）。
  // 主题条留在成片下方：换个主题重剪是出片后最常见的下一步。
  // #out 留给分析说明和反馈汇总这类次要信息，继续排在最后。
  // 一律单栏，顺序：画面 → 素材顺序 → 主题。
  // 素材顺序紧跟播放器，因为它**就是这个播放器的播放列表** ——
  // 上面在「连续播放 1/3」，下面标着哪段是 1/2/3、拖动能改顺序，
  // 两者分在左右两栏时，改顺序要在两边来回看。
  // 原来多选走两栏是为了填满左栏，但那和单选不一致（单选已经是单栏），
  // 而且顺序条挪走之后左栏只剩主题卡片，照样是一大片空。
  $('#stage').innerHTML =
    `<div id="cut"></div>`
    + `<div class="one"><div id="srcwrap">${playerCard}${orderCard}</div>${themeCard}</div>`
    + `<div id="out"></div>`;
  document.body.dataset.cut = '';
  document.body.dataset.multi = multi ? '1' : '';

  const all=[{id:'auto',name:t('auto'),name_en:t('auto'),
    desc:t('autoDesc'),desc_en:t('autoDesc')}, ...themes];
  const C=$('#chips');
  all.forEach(x=>{
    const b=el('button','chip'); b.textContent=themeName(x);
    b.setAttribute('aria-pressed', pickTheme===x.id?'true':'false');
    b.onclick=()=>{ pickTheme=x.id;
      // 只重画说明，不整页重绘 —— 重绘会把预估状态和已出的成片一起清掉
      $('#chips').querySelectorAll('.chip').forEach((e,j)=>
        e.setAttribute('aria-pressed', all[j].id===pickTheme?'true':'false'));
      paintDesc(); };
    C.appendChild(b);
  });
  // 换行之后不再有「看不见的溢出」，原来那套 ResizeObserver 渐隐可以去掉
  drawOrder();
  wirePlaylist();
  paintDesc();
  loadEst();
  $('#go').onclick = start;
}

async function start(){
  $('#go').disabled = true;
  pauseSource();                 // 开始剪了，原片没必要继续响
  $('#cut').innerHTML = `<div class="card"><div class="card-pad">
      <div class="run"><span class="spin"></span><span id="st">${t('submitting')}</span>
        <span id="pctn" class="pctn"></span></div>
      <div class="bar"><i id="barfill"></i></div></div></div>`;
  let r;
  try{
    r = await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({videos:picked().map(v=>v.id), ordered:true,
                           themes:[pickTheme], top:10})}).then(x=>x.json());
  }catch(e){ return fail(t('failed')); }
  clearInterval(poll);
  poll = setInterval(async ()=>{
    let j; try{ j = await fetch('/api/jobs/'+r.id).then(x=>x.json()); }catch(e){ return; }
    const st=$('#st'); if(st) st.textContent = j.stage;
    setStatus('run', `<span class="spin dot"></span><span>${esc(j.stage||'')}</span>${
      j.percent!=null ? `<b>${Math.round(j.percent)}%</b>` : ''}`);
    // 有百分比就画，没有就只留转圈 —— 管线里数不出来的阶段不编数字
    const f=$('#barfill'), n=$('#pctn');
    if(f && j.percent!=null){ f.style.width = j.percent+'%'; }
    if(n) n.textContent = j.percent!=null ? Math.round(j.percent)+'%' : '';
    if(j.state==='done'){ clearInterval(poll); done(j); }
    if(j.state==='error'){ clearInterval(poll); fail(j.error); }
  }, 600);
}

// **隐藏 <video> 不会让它停下来。** display:none 只是不画，声音照放，
// 多选时连播还会继续跳下一段 —— 剪完之后原片在背景里继续响，
// 用户以为是成片在放。所以收起原素材之前必须显式停掉，
// 并且解掉 onended，否则它还会自己换 src 接着播。
function pauseSource(){
  const w = $('#srcwrap'); if(!w) return;
  w.querySelectorAll('video').forEach(v => {
    v.onended = null;
    try{ v.pause(); }catch(_){}
  });
}

// 顶栏状态：剪辑中显示阶段，剪完显示成片信息并可点击回到结果。
// 成功提示不自动消失 —— 它同时是「跳到成片」的入口，消失了就得自己去找。
let statusHide=null;
function setStatus(mode, html, onClick){
  const b=$('#status'); if(!b) return;
  clearTimeout(statusHide);
  if(!mode){ b.removeAttribute('data-on'); b.innerHTML=''; b.onclick=null; return; }
  b.dataset.on = mode;
  b.innerHTML = html;
  b.onclick = onClick || null;
  if(mode==='fail') statusHide = setTimeout(()=>setStatus(null), 8000);
}

function fail(msg){
  $('#go').disabled=false;
  setStatus('fail', `<span class="dot">⚠</span><span>${t('failed')}</span>`);
  $('#cut').innerHTML = `<div class="card"><div class="card-pad">
    <div class="alert"><span>⚠</span><span>${t('failed')}: ${esc(msg)}</span></div></div></div>`;
}

function done(j){
  $('#go').disabled=false;
  const s=j.stats||{}, k=j.kind||{}, portrait=cur.height>cur.width;
  // 只留「结构」。有效打球和占比都去掉了 —— 对着真值实测平均相对误差 40%
  // （最差 68%：5fa9db9e 检测流算 28.3 秒、真值 75.7 秒）。
  // 它是在一个 75% 是误报的流上算的，本来就不可能准。
  // 结构是分类而不是数字，7 个视频（含 2 个留出）都判对了，而且它决定推荐哪个主题。
  const tail = `<div class="card"><div class="card-pad">
      <div class="note">${t('kindNote', k.kind==='sparse'?t('sparse'):t('dense'))}</div>
    </div></div>`;
  let h = '';

  // 「自动」会出两条：精华（当场看）和完整版（存档）。
  // 平级并排会逼用户做一次没必要的选择，而且两个播放器堆在一起很重 ——
  // 精华当主角放前面，完整版折叠成一行。
  const all = j.results||[];
  const pair = all.some(r=>r.theme==='spot') && all.some(r=>r.theme==='trim');
  const ordered = pair
    ? [...all.filter(r=>r.theme==='spot'), ...all.filter(r=>r.theme!=='spot')]
    : all;

  ordered.forEach((r)=>{
    const idx = all.indexOf(r);
    if(r.empty){
      h += `<div class="card"><div class="card-pad"><div class="note">
        ${t('empty')}</div></div></div>`;
      return;
    }
    const fold = pair && r.theme==='trim';
    // 写出两者的关系 —— 少了这句，用户会以为要在两个成片里二选一
    const rel = pair && r.theme==='spot' && s.duration
      ? `<div class="card-pad" style="padding:12px 20px 0"><div class="note">
           ${t('spotFrom', r.clips, mmss(s.duration))}</div></div>` : '';
    // 原来写「剪掉了 X 的捡球和等待」，和旁边的「有效打球 4 分钟」差 3.7 倍，
    // 看起来像剪错了。两个数各自都对，只是口径不同（有效打球用 0.3 秒的
    // 严格间隔，完整版每个球前后各留 0.5 秒且押不漏球）。
    // 所以副标题改成解释完整版本身是什么，不再报一个会引起对比的差值。
    const sub = fold ? ` · ${t('trimKeep', r.clips, s.trim_pad ?? 0.5)}` : '';
    h += `<div class="card${fold?' fold':''}"${fold?' data-open="0"':''}>
      <div class="card-hd"${fold?' data-fold="1"':''}>
        <h3>${esc(LANG==='en'?(r.name_en||r.name):r.name)} · ${
          fold ? mmss(r.seconds)+sub : r.clips+' / '+r.seconds+'s'}</h3>
        <span style="display:flex;gap:8px;align-items:center">
          ${fold?`<span class="caret">▸</span>`:
            `<button class="mark" data-mark="${idx}" aria-pressed="false">${t('del')}</button>`}
          ${isApp()
            ? `<button class="btn ghost" data-reveal="${esc(r.url)}">${t('reveal')}</button>`
            : `<a class="btn ghost" href="${r.url}" download>${t('download')}</a>`}
        </span>
      </div>
      ${rel}
      <div class="foldbody">
      ${player(r.url, portrait)}
      <div class="segs" data-idx="${idx}" data-theme="${esc(r.theme)}">
        <div class="segs-hd">${t('segsHint',r.clips)}${
          r.segments.some(x=>x.star)?' · '+t('starHint'):''}</div>
        ${r.segments.map((x,i)=>
        `<span class="seg${x.star?' star':''}" data-i="${i}" data-sid="${x.id}"
               ${x.star?`title="${t('starTitle')}"`:''}>
           <button data-off="${x.offset}" data-idx="${idx}">${mmss(x.start)}–${mmss(x.end)}</button>
           <a href="${x.url}" download title="${t('segTitle')}">↓</a>
           <a class="rej" href="#" data-s="${x.start}" data-e="${x.end}"
              title="${t('delTitle')}">✕</a>
         </span>`).join('')}
      </div>
      </div>
    </div>`;
  });
  // 「原片」开关：成片顶掉了原片播放器，但比对和重剪时还得能调回来。
  h += `<div class="srcline">
      <button type="button" id="srctoggle">${t('showSrc')}</button></div>`;
  $('#cut').innerHTML = h;
  $('#out').innerHTML = tail + `<div class="card"><div class="card-pad">
      <div class="fb" id="fb"></div></div></div>`;
  pauseSource();                 // 收起之前先停，否则藏起来还在放
  document.body.dataset.cut = '1';
  $('#srctoggle').onclick = e => {
    const on = document.body.dataset.cut !== '1';
    document.body.dataset.cut = on ? '1' : 'src';
    e.target.textContent = on ? t('showSrc') : t('hideSrc');
    if(on) pauseSource();        // 再次收起时同样要停
    else $('#srcwrap').scrollIntoView({behavior:'smooth', block:'nearest'});
  };
  // 顶栏报完成。**不自动消失** —— 它同时是「跳到成片」的入口：
  // 长素材剪完时用户往往已经滚到别处，有个常驻的锚点比让他自己找要好。
  // 只报主成片，不求和。「自动」会出精华 + 完整版，而完整版本身就包含
  // 精华那几段 —— 加起来是重复计数（实测一段 3.5 分钟素材报成「63 段」）。
  // ordered 已经把主成片排在最前。
  const main = ordered.find(r => !r.empty);
  setStatus('done', !main
    ? `<span class="dot">✓</span><span>${t('doneTop')}</span>`
    : `<span class="dot">✓</span><span>${esc(LANG==='en'?(main.name_en||main.name):main.name)}</span><b>${
        main.clips} ${t('doneClips')} · ${mmss(main.seconds)}</b>`,
    () => $('#cut').scrollIntoView({behavior:'smooth', block:'start'}));
  $('#cut').querySelectorAll('[data-fold]').forEach(hd=>{
    hd.style.cursor='pointer';
    hd.onclick = e => {
      if(e.target.closest('a')) return;      // 下载键不该顺带展开
      const c = hd.closest('.card');
      const open = c.dataset.open === '1';
      c.dataset.open = open ? '0' : '1';
      hd.querySelector('.caret').textContent = open ? '▸' : '▾';
    };
  });
  loadFeedback();

  // 「这段不对」：只声明这个区间没有有效击球，不要求用户精确到某一拍。
  // 这正是重排器要的监督信号 —— 区间内所有候选都是可信负例。
  // 「标记问题」进入编辑态才显示 ✕
  $('#cut').addEventListener('click', e => {
    const m = e.target.closest('.mark');
    if(!m) return;
    const segs = $('#cut').querySelector(`.segs[data-idx="${m.dataset.mark}"]`);
    const on = segs.dataset.edit === '1';
    segs.dataset.edit = on ? '' : '1';
    m.setAttribute('aria-pressed', on ? 'false' : 'true');
    m.textContent = on ? t('del') : t('done');
    segs.querySelector('.segs-hd').textContent = on
      ? t('segsHint', segs.querySelectorAll('.seg').length)
      : t('delHint');
  });

  $('#cut').addEventListener('click', async e => {
    const a = e.target.closest('a.rej');
    if(!a) return;
    e.preventDefault();
    const seg = a.closest('.seg');
    const segs = seg.closest('.segs');
    if(seg.dataset.rejected === '1') return;
    const alive = [...segs.querySelectorAll('.seg')]
      .filter(x => x.dataset.rejected !== '1');
    if(alive.length <= 1) return;                 // 至少留一段
    seg.dataset.rejected = '1';
    const card = segs.closest('.card');
    const hd = card.querySelector('.card-hd h3');
    hd.dataset.busy = '1';
    try{
      // **删除本身不再记负例。** 原来是「删了就当作这段没在打球」，
      // 但用户删一段的原因可能只是想剪短，那段其实打得好好的。
      // 把真实回合当负例喂回去会反向污染模型，而且是所有用户一起污染 ——
      // 所以改成删完再问一句，只有明确说「没在打球」才回流。
      const keep = [...segs.querySelectorAll('.seg')]
        .filter(x => x.dataset.rejected !== '1').map(x => +x.dataset.sid);
      const r = await fetch('/api/recut',{method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({video:cur.id, theme:segs.dataset.theme, keep})
      }).then(x=>x.json());
      if(r.url){
        const v = card.querySelector('video');
        v.src = r.url; v.load();
        hd.textContent = hd.textContent.replace(/· .*$/, `· ${r.clips} 段 / ${r.seconds} 秒`);
        askWhy(seg, +a.dataset.s, +a.dataset.e);
      }
      loadFeedback();
    }catch(err){ seg.dataset.rejected=''; }
    finally{ hd.dataset.busy=''; }
  });

  // 删完问一句「为什么」。**不阻塞、默认不回流** —— 不点就当成「只是不想要」，
  // 宁可少收数据也不能收含义不明的数据。只有明确说「没在打球」才算负例，
  // 那是我们唯一能确信的标签。
  function askWhy(seg, start, end){
    seg.dataset.rejected = '1';
    seg.innerHTML = `<div class="why">
        <span>${t('whyAsk')}</span>
        <button type="button" class="why-yes">${t('whyYes')}</button>
        <button type="button" class="why-no">${t('whyNo')}</button>
      </div>`;
    const close = () => seg.remove();
    seg.querySelector('.why-no').onclick = close;
    seg.querySelector('.why-yes').onclick = async () => {
      seg.querySelector('.why').innerHTML = `<span>${t('whyThanks')}</span>`;
      try{
        await fetch('/api/feedback',{method:'POST',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({video:cur.id, start, end, verdict:'not_playing'})});
        loadFeedback();
      }catch(_){}
      setTimeout(close, 1600);
    };
    setTimeout(() => { if(seg.isConnected) close(); }, 12000);
  }

  // 点片段 -> 主播放器跳到该片段在拼接成片里的位置
  $('#cut').querySelectorAll('.seg button').forEach(b=>{
    b.onclick = ()=>{
      const wrap = b.closest('.segs');
      const v = wrap.previousElementSibling.querySelector('video');
      v.currentTime = parseFloat(b.dataset.off) + 0.05;
      v.play();
      wrap.querySelectorAll('.seg').forEach(s=>s.dataset.on='');
      b.parentElement.dataset.on = '1';
    };
  });
  // 播放过程中高亮当前片段
  $('#cut').querySelectorAll('.card video').forEach(v=>{
    const wrap = v.closest('.card').querySelector('.segs');
    if(!wrap) return;
    const offs = [...wrap.querySelectorAll('.seg button')].map(b=>parseFloat(b.dataset.off));
    // 成片结尾有 1.6 秒淡出，播完会停在纯黑的最后一帧（实测亮度 0x00），
    // 看起来像加载失败。播完退回首帧。
    v.onended = ()=>{ try{ v.currentTime = 0; }catch(e){} };
    v.ontimeupdate = ()=>{
      let k = 0;
      for(let i=0;i<offs.length;i++) if(v.currentTime >= offs[i]) k = i;
      wrap.querySelectorAll('.seg').forEach((s,i)=>s.dataset.on = i===k ? '1' : '');
    };
  });
}

async function loadFeedback(){
  const el = $('#fb'); if(!el) return;
  try{
    const d = await fetch('/api/feedback').then(r=>r.json());
    el.innerHTML = d.total_ranges
      ? t('fbSome', d.total_ranges, d.total_seconds, d.videos.length)
      : t('fbNone');
  }catch(e){ el.textContent=''; }
}

function upload(f, done){
  const fin = ()=>{ if(done) done(); };
  if(!f) return fin();
  const lab=$('#up'), txt=$('#uptxt');
  lab.dataset.busy='1'; txt.textContent=t('uploading');
  $('#prog').innerHTML='<div class="prog"><i id="pb"></i></div>';
  const xhr=new XMLHttpRequest(); xhr.open('POST','/api/upload');
  xhr.upload.onprogress = e => { if(e.lengthComputable)
    $('#pb').style.width = (100*e.loaded/e.total)+'%'; };
  const reset=()=>{ lab.dataset.busy=''; txt.textContent=t('pick'); $('#prog').innerHTML=''; };
  const err=m=>{ reset();
    $('#prog').innerHTML=`<div class="note" style="padding:0 16px 10px;color:var(--warn)">${esc(m)}</div>`;
    fin(); };
  xhr.onload = ()=>{
    if(xhr.status===200){
      reset();
      const v = JSON.parse(xhr.responseText);
      // 按 id 去重，不按 fp —— /api/videos 不返回 fp（那是服务端内部指纹），
      // 所以页面加载后所有条目的 x.fp 都是 undefined，原来的判断永远为假，
      // 重复导入就会往列表里再推一条。服务端已按指纹去重并返回旧记录，
      // 所以同一个视频拿到的 id 一定相同。
      const at = videos.findIndex(x => x.id === v.id);
      if(at >= 0){ choose(at, multiMode); drawList();   // 已有同一个视频，直接选中它
        $('#prog').innerHTML =
          '<div class="note" style="padding:0 16px 10px">这个视频已经在列表里了</div>';
        setTimeout(()=>$('#prog').innerHTML='', 2600);
      }else{
        videos.push(v); drawList();
        document.body.dataset.view='';        // 首屏让位给工作台
        // 多选模式下新导入的素材应该加进选择，而不是把已选的全顶掉
        choose(videos.length-1, multiMode);
      }
      fin();
    }else{
      let m=t('upfail'); try{ m=JSON.parse(xhr.responseText).detail||m; }catch(e){}
      err(m);
    }
  };
  xhr.onerror = ()=>err(t('upfail'));    // err 里已经 fin()
  const fd=new FormData(); fd.append('file',f); xhr.send(fd);
}

// 顺序上传而不是并发：并发几个几百 MB 的文件会互相抢带宽，
// 进度条也没法表达「第几个」。
async function uploadAll(files){
  for(const f of [...files]) await new Promise(done => upload(f, done));
}

// ── 按需下载的模型 ────────────────────────────────────────
// 323MB 的声学模型不进安装包，第一次要用时才下。
// 服务端在导入和剪辑两个入口都会返回 424，这里统一接住并弹下载 ——
// **不降级继续跑**：没有模型时检测准确率从 0.68 掉到 0.38，
// 而且乒乓球门禁会放行一切，两者都不报错，只让成片悄悄变差。
let dlPoll = null;

// **一次只开一个面板。** 两个面板都是 .sheet、同一个 z-index，
// 同时打开时谁盖谁是未定义的（实际截图里就出现了下载面板被设置面板压住，
// 而下载面板是挡路的、不该被盖掉）。所有开关都走这里。
function openSheet(id){
  document.querySelectorAll('.sheet').forEach(s => { s.hidden = (s.id !== id); });
}
function closeSheets(){
  document.querySelectorAll('.sheet').forEach(s => { s.hidden = true; });
}

async function needAssets(detail){
  const st = await fetch('/api/assets').then(r=>r.json()).catch(()=>null);
  const a = st && st.assets && st.assets.find(x=>!x.ready);
  // 下载是挡路的要求，优先级高于设置 —— 它一出现就把别的面板关掉
  openSheet('dl');
  $('#dl-t').textContent = t('dlTitle');
  $('#dl-d').textContent = detail || (a ? t('dlDesc', a.note, a.mb) : '');
  $('#dl-bar').hidden = true;
  const go = $('#dl-go');
  if(a && !a.configured){
    // 没配下载地址是我们的问题，别让用户对着一个点了没反应的按钮
    go.hidden = true;
    $('#dl-msg').textContent = t('dlNoUrl');
    return;
  }
  go.hidden = false;
  go.disabled = false;
  go.textContent = t('dlGo');
  $('#dl-msg').textContent = '';
  go.onclick = async () => {
    go.disabled = true;
    $('#dl-bar').hidden = false;
    try{
      const r = await fetch('/api/assets/fetch', {method:'POST'});
      if(!r.ok){ $('#dl-msg').textContent = (await r.json()).detail || t('dlFail');
                 go.disabled = false; return; }
      pollDownload();
    }catch(e){ $('#dl-msg').textContent = t('dlFail'); go.disabled = false; }
  };
}

function pollDownload(){
  clearInterval(dlPoll);
  dlPoll = setInterval(async () => {
    let st; try{ st = await fetch('/api/assets').then(r=>r.json()); }catch(e){ return; }
    const d = Object.values(st.downloading || {})[0];
    if(d){
      $('#dl-fill').style.width = (d.percent||0) + '%';
      $('#dl-msg').textContent = d.state === 'error'
        ? (t('dlFail') + '：' + (d.error||''))
        : t('dlProgress', Math.round((d.done||0)/1e6), Math.round((d.total||0)/1e6));
      if(d.state === 'error'){ clearInterval(dlPoll); $('#dl-go').disabled = false; }
    }
    if(st.ready){
      clearInterval(dlPoll);
      $('#dl-msg').textContent = t('dlDone');
      setTimeout(()=>{ $('#dl').hidden = true; }, 1200);
    }
  }, 700);
}

// ── 设置：反馈回流 ────────────────────────────────────────
// **默认关闭，而且要在同意之前就把要发什么摆清楚。**
// 回传的是嵌入（每秒一个 2048 维向量），不是音频也不是画面 ——
// 但我不写「无法还原」：嵌入反演在别的模型上有过成功案例，
// 我只能说据我所知没有可行的方法，所以这件事必须用户明确同意。
async function loadPrefs(){
  // 静态说明先渲染。**不要等接口成功才填** —— 接口挂掉时如果直接 return，
  // 用户看到的是一个什么都没有的空壳，比一句错误提示更让人摸不着头脑。
  $('#pref-d').textContent = t('prefDesc');
  $('#will').innerHTML = t('prefWill').map(x=>`<li>${esc(x)}</li>`).join('');
  $('#wont').innerHTML = t('prefWont').map(x=>`<li>${esc(x)}</li>`).join('');
  const yes=$('#contrib-toggle'), no=$('#contrib-send');
  yes.hidden = no.hidden = true;
  $('#contrib-msg').textContent = '';

  let d;
  try{ d = await fetch('/api/contrib').then(r=>r.json()); }
  catch(e){ $('#pref-stat').textContent = t('prefUnavailable'); return; }

  $('#pref-stat').textContent = d.pending
    ? t('prefPending', d.pending, d.candidates, d.kb)
    : t('prefEmpty');

  const setOn = async (on) => {
    await fetch('/api/contrib/optin', {method:'POST',
      headers:{'Content-Type':'application/json'}, body: JSON.stringify({on})});
  };

  if(!d.on){
    // 关着的时候是一次明确的二选一：同意，或者跳过。
    // 不做成一个默默躺着的开关 —— 那样多数人既不会打开也不知道有这回事，
    // 而这件事的默认值必须是「不发」，所以得让它至少被看见一次。
    yes.hidden = no.hidden = false;
    yes.textContent = t('prefAgree');
    yes.classList.remove('ghost');
    no.textContent  = t('prefSkip');
    no.classList.add('ghost');
    yes.onclick = async () => {
      yes.disabled = no.disabled = true;
      try{
        await setOn(true);
        if(d.pending && d.endpoint){
          $('#contrib-msg').textContent = t('prefSending');
          const r = await fetch('/api/contrib/send', {method:'POST'});
          const j = await r.json();
          $('#contrib-msg').textContent = r.ok
            ? t('prefSent', j.sent, j.kb) : (j.detail || t('prefFail'));
        }
        await loadPrefs();
      }finally{ yes.disabled = no.disabled = false; }
    };
    no.onclick = () => { closeSheets(); };
  }else{
    // 已经同意过：只留一个关闭入口，外加「现在发送」（有待发且配了收集端时）
    yes.hidden = false;
    yes.textContent = t('prefOff');
    yes.classList.add('ghost');
    yes.onclick = async () => {
      yes.disabled = true;
      try{ await setOn(false); await loadPrefs(); }finally{ yes.disabled = false; }
    };
    no.hidden = !(Number(d.pending) > 0 && Boolean(d.endpoint));
    no.textContent = t('prefSend');
    no.classList.remove('ghost');
    no.onclick = async () => {
      no.disabled = true;
      $('#contrib-msg').textContent = t('prefSending');
      try{
        const r = await fetch('/api/contrib/send', {method:'POST'});
        const j = await r.json();
        $('#contrib-msg').textContent = r.ok
          ? t('prefSent', j.sent, j.kb) : (j.detail || t('prefFail'));
        if(r.ok) await loadPrefs();
      }catch(e){ $('#contrib-msg').textContent = t('prefFail'); }
      finally{ no.disabled = false; }
    };
    if(d.pending && !d.endpoint) $('#contrib-msg').textContent = t('prefNoEndpoint');
  }
}

$('#prefs').onclick = () => { openSheet('sheet'); loadPrefs(); };
$('#sheet-x').onclick = closeSheets;
$('#sheet').onclick = e => { if(e.target.id === 'sheet') closeSheets(); };
// 下载面板不给点背景关闭 —— 它是必须完成的一步，不是可以随手划走的提示。
// Esc 只关设置。
document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && !$('#sheet').hidden) closeSheets();
});

// ── 桌面版 ────────────────────────────────────────────────
// 装在 app 里跑时走这条：素材**按原路径登记，一个字节都不拷贝**。
// 浏览器的 <input type=file> 只能给到文件内容、拿不到路径，
// 所以选文件必须交给原生侧（见 app_main.py 的 Bridge.pick_videos）。
const isApp = () => !!(window.pywebview && window.pywebview.api);

function addNote(msg, warn){
  $('#prog').innerHTML = `<div class="note" style="padding:0 16px 10px${
    warn?';color:var(--warn)':''}">${esc(msg)}</div>`;
  setTimeout(()=>{ $('#prog').innerHTML=''; }, 4200);
}

// 供原生侧在拖放之后回调 —— 拖放事件在 Python 那边处理（只有它拿得到路径）
async function addLocal(paths){
  if(!paths || !paths.length) return;
  const txt=$('#uptxt'); const was=txt.textContent; txt.textContent=t('uploading');
  try{
    const r = await fetch('/api/local/add', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({paths})});
    const d = await r.json();
    if(!r.ok) throw new Error(d.detail||'导入失败');
    const got=[];
    for(const v of (d.added||[])){
      const at = videos.findIndex(x=>x.id===v.id);
      if(at>=0){ got.push(at); } else { videos.push(v); got.push(videos.length-1); }
    }
    drawList();
    if(got.length){
      document.body.dataset.view='';
      // **一次选进来多个 = 默认当成一组。** 一次挑五个文件几乎只有一个意思：
      // 这是同一堂课分的几段，要接成一个成片。原来只选中最后一个，
      // 用户还得自己去开多选、再逐个点回来 —— 那是把已经表达清楚的意图
      // 又推回给他重做一遍。
      if(got.length > 1){
        multiMode = true;
        sel = got.map(i=>videos[i].id);
        reordered = false;        // 新的一组，回到按拍摄时间排
        sortSel();
        cur = picked()[0];
        [...$('#list').children].forEach((e,j)=>
          e.setAttribute('aria-selected', sel.includes(videos[j].id)?'true':'false'));
        syncMulti();
        draw();
      } else {
        choose(got[0], multiMode);
      }
    }
    if(d.failed && d.failed.length)
      addNote(d.failed.map(b=>`${b.name}：${b.why}`).join('；'), true);
  }catch(e){ addNote(e.message||'导入失败', true); }
  finally{ txt.textContent = was; }
}
window.addLocal = addLocal;          // Python 侧拖放后调它

async function pickLocal(){
  try{
    const paths = await window.pywebview.api.pick_videos();
    await addLocal(paths);
  }catch(e){ addNote('打不开文件选择器', true); }
}

$('#file').onchange = e => { uploadAll(e.target.files); e.target.value=''; };
const S=$('#side');
['dragenter','dragover'].forEach(k=>S.addEventListener(k,e=>{
  e.preventDefault(); S.classList.add('drop'); }));
['dragleave','drop'].forEach(k=>S.addEventListener(k,e=>{
  e.preventDefault(); S.classList.remove('drop'); }));
S.addEventListener('drop', e => uploadAll(e.dataTransfer.files));

function applyLang(){
  document.documentElement.lang = LANG==='zh' ? 'zh-CN' : 'en';
  $('#lang').textContent = LANG==='zh' ? 'EN' : '中';
  $('#tagline').textContent = t('tagline');
  $('#uptxt').textContent = t('pick');
  syncMulti();
  drawList();
  // 必须先判首屏。首屏把侧栏藏了（那时候列表是空的，没东西可列），
  // 唯一的导入入口就是首屏中间那块。这里要是直接 blank()，
  // 就把它盖成了空态文案，而侧栏还藏着 —— 两个导入入口一起没了，
  // 新用户第一次打开就是死路。boot().then(applyLang) 保证了每次
  // 冷启动都会走到这儿，所以这条不是边角情况。
  if(document.body.dataset.view === 'landing') landing();
  else if(cur) draw();
  else if(videos.length) choose(0);
  else blank('▤', t('blank'), t('blankSub'));
}
$('#lang').onclick = ()=>{
  LANG = LANG==='zh' ? 'en' : 'zh';
  localStorage.setItem('pipo_lang', LANG);
  applyLang();
};

fetch('/api/me').then(r=>r.ok?r.json():null).then(m=>{
  if(m) $('#who').textContent = m.name;
});
$('#signout').onclick = async ()=>{
  await fetch('/api/logout',{method:'POST'});
  location.href = '/login.html';
};
boot().then(applyLang);
</script>

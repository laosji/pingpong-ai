<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>授权 · Pipo AI</title>
<style>
:root{--bg:#f7f7f6;--surface:#fff;--line:#e8e6e3;--line-2:#d6d3cf;
  --ink:#18181b;--ink-2:#52525b;--ink-3:#8b8782;--accent:#2563eb;--on-accent:#fff;
  --warn:#b45309;--warn-wash:#fffbeb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1012;--surface:#17181b;
  --line:#26282c;--line-2:#34373c;--ink:#f4f4f5;--ink-2:#a1a1aa;--ink-3:#71717a;
  --accent:#5b8dff;--on-accent:#0b1220;--warn:#f0b429;--warn-wash:#1f1a0e}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);
  color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",
  "Segoe UI","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
.box{width:min(420px,92vw);background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:30px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.06)}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);
  display:grid;place-items:center;color:var(--on-accent);font-size:18px;font-weight:700}
h1{margin:16px 0 8px;font-size:17px;font-weight:640;letter-spacing:-.01em}
p{margin:0 0 18px;font-size:13.5px;color:var(--ink-2);line-height:1.65}
.perm{border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:18px}
.perm div{font-size:13px;color:var(--ink-2);padding:3px 0}
.perm div::before{content:"·";color:var(--accent);font-weight:700;margin-right:8px}
input{width:100%;border:1px solid var(--line-2);background:transparent;color:var(--ink);
  border-radius:10px;padding:11px 13px;font:inherit;font-size:14px;outline:0}
input:focus{border-color:var(--accent)}
.row{display:flex;gap:10px;margin-top:14px}
button{flex:1;border:0;border-radius:10px;padding:11px;font:inherit;font-size:14px;
  font-weight:560;cursor:pointer;transition:filter .12s}
.ok{background:var(--accent);color:var(--on-accent)}
.ok:hover{filter:brightness(1.08)}
.no{background:transparent;color:var(--ink-2);border:1px solid var(--line-2)}
.err{background:var(--warn-wash);color:var(--warn);font-size:12.5px;padding:9px 13px;
  border-radius:8px;margin-top:14px}
.who{font-size:12.5px;color:var(--ink-3);margin-bottom:14px}
</style>
<div class="box">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none">
    <path d="M2.6 19.2c3.4.2 7-1.4 9.6-4.3" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" opacity=".38"/>
    <path d="M8.4 19.4c2.9-.6 5.5-2.5 7.3-5.2" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" opacity=".7"/>
    <circle cx="18.4" cy="7.4" r="3.6" fill="currentColor"/>
  </svg></div>
  <h1 id="title">授权访问 Pipo AI</h1>
  <p id="lead">连接后，助手可以代你上传录像并生成集锦。</p>
  <div class="perm">
    <div>查看你上传的录像列表</div>
    <div>按你的要求生成集锦并给出下载链接</div>
    <div>获取上传链接转交给你</div>
  </div>
  <div class="who" id="who" hidden></div>
  <div id="need">
    <input id="tok" placeholder="邀请码 / Invite code" autocomplete="off">
  </div>
  <div class="row">
    <button class="no" onclick="history.back()">取消</button>
    <button class="ok" id="go" onclick="approve()">同意并连接</button>
  </div>
  <div class="err" id="err" hidden></div>
</div>
<script>
const Q = new URLSearchParams(location.search);
const $ = s => document.querySelector(s);

// 已登录就不用再填邀请码 —— 大多数用户是从网页端点过来的
fetch('/api/me').then(r => r.ok ? r.json() : null).then(m => {
  if(m){ $('#need').hidden = true;
         $('#who').hidden = false;
         $('#who').textContent = '当前身份：' + m.name; }
});

async function approve(){
  $('#err').hidden = true;
  $('#go').disabled = true;
  try{
    const r = await fetch('/oauth/approve', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({
        token: $('#tok').value.trim(),
        client_id: Q.get('client_id') || '',
        redirect_uri: Q.get('redirect_uri') || '',
        state: Q.get('state') || '',
        code_challenge: Q.get('code_challenge') || ''
      })
    });
    const d = await r.json();
    if(!r.ok) throw new Error(d.detail || '授权失败');
    location.href = d.redirect;
  }catch(e){
    $('#err').textContent = e.message;
    $('#err').hidden = false;
    $('#go').disabled = false;
  }
}
</script>

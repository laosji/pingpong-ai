<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipo AI</title>
<style>
:root{--bg:#f7f7f6;--surface:#fff;--line:#e8e6e3;--line-2:#d6d3cf;
  --ink:#18181b;--ink-2:#52525b;--ink-3:#8b8782;--accent:#2563eb;--on-accent:#fff;
  --warn:#b45309;--warn-wash:#fffbeb}
@media (prefers-color-scheme:dark){:root{--bg:#0f1012;--surface:#17181b;
  --line:#26282c;--line-2:#34373c;--ink:#f4f4f5;--ink-2:#a1a1aa;--ink-3:#71717a;
  --accent:#5b8dff;--on-accent:#0b1220;--warn:#f0b429;--warn-wash:#1f1a0e}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);
  color:var(--ink);font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",
  "Segoe UI","Helvetica Neue",sans-serif;-webkit-font-smoothing:antialiased}
.box{width:min(400px,92vw);background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:32px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 28px rgba(0,0,0,.06)}
.logo{width:34px;height:34px;border-radius:9px;background:var(--accent);
  display:grid;place-items:center;color:var(--on-accent);font-size:18px;font-weight:700;
  margin-bottom:18px}
h1{margin:0 0 6px;font-size:18px;font-weight:640;letter-spacing:-.01em}
p{margin:0 0 22px;font-size:13px;color:var(--ink-3);line-height:1.6}
input{width:100%;border:1px solid var(--line-2);background:transparent;color:var(--ink);
  border-radius:10px;padding:11px 13px;font:inherit;font-size:14px;outline:0;
  transition:border-color .12s}
input:focus{border-color:var(--accent)}
button{width:100%;margin-top:12px;border:0;border-radius:10px;padding:11px;
  background:var(--accent);color:var(--on-accent);font:inherit;font-size:14px;
  font-weight:560;cursor:pointer;transition:filter .12s}
button:hover{filter:brightness(1.08)}
.err{background:var(--warn-wash);color:var(--warn);font-size:12.5px;padding:9px 13px;
  border-radius:8px;margin-bottom:16px}
.hint{margin:18px 0 0;font-size:12px;color:var(--ink-3)}
</style>
<div class="box">
  <div class="logo">P</div>
  <h1>Pipo AI</h1>
  <p id="sub">Your table tennis highlights, automatically</p>
  <div class="err" id="err" hidden>邀请码无效或已失效 · Invalid invite code</div>
  <form onsubmit="go(event)">
    <input id="t" placeholder="邀请码 / Invite code" autocomplete="off" autofocus>
    <button type="submit">进入 · Enter</button>
  </form>
  <p class="hint">内测阶段，需要邀请码。<br>Private beta — an invite code is required.</p>
</div>
<script>
if(new URLSearchParams(location.search).has('bad'))
  document.getElementById('err').hidden = false;
function go(e){
  e.preventDefault();
  const v = document.getElementById('t').value.trim();
  if(v) location.href = '/enter?t=' + encodeURIComponent(v);
}
</script>

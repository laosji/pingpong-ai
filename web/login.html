<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pipo AI · 开始使用</title>
<link rel="stylesheet" href="/auth.css">
<!-- 这一页只做一件事：拿着邀请码进去。
     「没有码怎么办」是另一个意图，挪到 claim.html。
     原来两个表单挤在一页里，两个提交按钮谁也不比谁显眼，
     而顶部那一条错误提示既可能在说邀请码也可能在说邮箱。 -->
<div class="box">
  <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none">
    <path d="M2.6 19.2c3.4.2 7-1.4 9.6-4.3" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" opacity=".38"/>
    <path d="M8.4 19.4c2.9-.6 5.5-2.5 7.3-5.2" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round" opacity=".7"/>
    <circle cx="18.4" cy="7.4" r="3.6" fill="currentColor"/>
  </svg></div>
  <h1>开始使用 Pipo</h1>
  <p class="sub">把训练录像剪成集锦 · Turn practice footage into highlights</p>

  <form onsubmit="go(event)" novalidate>
    <div class="field">
      <label for="code">邀请码 · Invite code</label>
      <input id="code" autocomplete="off" autocapitalize="characters"
             spellcheck="false" placeholder="例如 K7M2QX9PBRTC" autofocus>
      <p class="msg" id="m-code"></p>
    </div>
    <div class="field">
      <label for="name">怎么称呼你 · Your name</label>
      <input id="name" autocomplete="nickname" maxlength="24" placeholder="可不填">
    </div>
    <button type="submit" id="btn">开始使用 · Start</button>
    <p class="msg" id="m-form"></p>
  </form>

  <p class="alt">
    还没有邀请码？<a href="/claim.html">领取一个 →</a><br>
    <span style="opacity:.75">Need a code? <a href="/claim.html">Get one</a></span>
  </p>
  <p class="alt" style="border:0;padding-top:0;margin-top:10px;opacity:.7">
    已经注册过？点你收到的那条链接即可，不用在这里填。<br>
    Already registered? Just open the link you were sent.
  </p>
  <p class="foot">
    <a href="https://x.com/laosji_net" target="_blank" rel="noopener">𝕏 @laosji_net</a>
  </p>
</div>
<script>
const $ = s => document.querySelector(s);
function say(where, text){
  $('#m-'+where).textContent = text || '';
  if(where === 'code') $('#code').setAttribute('aria-invalid', text ? 'true' : 'false');
}

// 从领码页回来时把码带过来。走 sessionStorage 而不是查询串 ——
// 邀请码是凭证，放进 URL 会留在历史记录里，也容易被整条链接转发出去。
const carried = sessionStorage.getItem('pipo_code');
if(carried){
  $('#code').value = carried;
  sessionStorage.removeItem('pipo_code');
  $('#name').focus();
}
if(new URLSearchParams(location.search).has('bad'))
  say('form', '这条链接无效或已失效 · That link is no longer valid');

async function go(e){
  e.preventDefault();
  say('code',''); say('form','');
  const code = $('#code').value.trim().toUpperCase();
  const name = $('#name').value.trim();
  if(!code){ say('code','请填邀请码 · Enter your invite code'); $('#code').focus(); return; }
  $('#btn').disabled = true;
  try{
    const r = await fetch('/api/signup', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({code, name})});
    const d = await r.json();
    if(!r.ok){ $('#btn').disabled = false; return say('code', d.detail || '注册失败'); }
    location.href = '/';                 // cookie 已由服务端种好
  }catch(_){
    $('#btn').disabled = false;
    say('form','网络不通，稍后再试 · Network error, try again');
  }
}
</script>
